<!--
  entry.html … 可用性登録フォーム（?view=entry）

  **この画面のわかりやすさが参加率に直結する**（design.md 4.3）。
  操作に不慣れな人がスマホで開く前提で、項目を増やさず、1画面で完結させる。

  ?view=entry&proxy=1 で開くと代理入力モードになり、種別の選択と入力者の記名が出る。
  これはセキュリティ境界ではなく、画面を分けるためのもの。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('style'); ?>
</head>
<body>
  <div class="page">
    <h1 class="page__title" id="pageTitle">ボランティア登録</h1>

    <div class="loading" id="loading">読み込んでいます…</div>

    <!-- 入力 -->
    <form id="entryForm" hidden autocomplete="on">
      <p class="formError" hidden></p>

      <div class="field" id="typeField" hidden>
        <label for="f_type">種別</label>
        <select id="f_type">
          <option value="volunteer">ボランティア</option>
          <option value="staff">職員</option>
        </select>
        <p class="hint">職員として登録すると、時間帯の申告がなくても既定の勤務時間帯で扱われます。</p>
      </div>

      <div class="field">
        <label for="f_name">お名前 <span class="req">必須</span></label>
        <input type="text" id="f_name" maxlength="50" autocomplete="name" placeholder="山田 太郎">
      </div>

      <!--
        性別・年齢は必須。選択肢は common_script.html の GENDER_OPTIONS から組み立てる
        （サーバー側の GENDER_VALUES と食い違わせないため、ここには直接書かない）。
      -->
      <div class="field field--row">
        <div>
          <label for="f_gender">性別 <span class="req">必須</span></label>
          <select id="f_gender"></select>
        </div>
        <div>
          <label for="f_age">年齢 <span class="req">必須</span></label>
          <input type="number" id="f_age" inputmode="numeric" pattern="[0-9]*"
                 min="0" max="120" step="1" placeholder="42">
        </div>
      </div>

      <div class="field">
        <label for="f_contact">連絡先</label>
        <input type="text" id="f_contact" maxlength="100" autocomplete="tel"
               placeholder="メールアドレス">
        <p class="hint">シフトが決まりましたらメールでお知らせします</p>
      </div>

      <div class="field">
        <label>入れる日と時間帯 <span class="req">必須</span></label>
        <div id="dayList"></div>
        <button type="button" class="btn btn--block btn--sub" id="addDay">＋ 日付を追加</button>
        <p class="hint">複数の日に入れる場合は「＋ 日付を追加」を押してください。
          直前の日と同じ時間帯が入るので、違うときだけ直してください。</p>
        <p class="hint">途中で抜ける日は「＋ 時間帯を追加」で分けて入力してください。
          （例: 10:00〜12:00 と 15:00〜17:00）</p>
      </div>

      <button type="submit" class="btn btn--primary btn--block" id="submitBtn">この内容で登録する</button>
    </form>

    <!-- 送信後の控え -->
    <div id="receipt" hidden></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
    const BOOT = <?!= toJsonLiteral_(boot); ?>;
  </script>
  <?!= include('common_script'); ?>
  <?!= include('entry_script'); ?>
</body>
</html>

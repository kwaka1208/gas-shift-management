<script>
/*
  entry_script.html … 応募フォームのロジック

  ここは「登録できずに諦められること」が最大の失敗。
  迷う操作を作らず、エラーは何をすればよいかまで書く。
*/

(function () {
  'use strict';

  const call = App.call;
  const esc = App.esc;
  const toMin = App.toMin;
  const toHHMM = App.toHHMM;
  const toast = App.toast;

  const DOW = ['日', '月', '火', '水', '木', '金', '土'];
  const $ = function (id) { return document.getElementById(id); };

  const state = {
    token: BOOT.token,
    proxy: BOOT.proxy === true,
    config: null,
    busy: false
  };

  // ------------------------------------------------------------ 起動

  function boot() {
    call('getBootstrap', state.token).then(function (data) {
      state.config = data.config;
      setupProxyFields();
      addDayBlock(BOOT.date || App.todayStr());
      $('loading').hidden = true;
      $('entryForm').hidden = false;
    }).catch(function (e) {
      $('loading').textContent = e.message;
    });
  }

  /**
   * 代理入力モードのときだけ、種別の欄を出す。
   *
   * 「入力した人」の欄は画面から外した。サーバー側（payload.operator の受け取りと
   * `_log` への記録）はそのまま残してあるので、必要になれば欄を戻すだけで復活する。
   */
  function setupProxyFields() {
    if (!state.proxy) return;
    $('pageTitle').textContent = '代理で登録する';
    $('typeField').hidden = false;
  }

  // ------------------------------------------------------- 日付と時間帯

  /*
    「日付ブロック」の中に「時間帯の行」が並ぶ入れ子。
      ┌─ 8月10日(土) ──────┐
      │ 10:00 〜 12:00   × │
      │ [＋ 時間帯を追加]   │
      └────────────────────┘

    日ごとに都合が違うのが普通なので、日付を1つ選んで終わりにはしない。
    ただし**日付を足したときは直前の日の時間帯をそのまま入れる。**
    同じ時間で通う人が大半なので、既定で埋まっていれば日付を足すだけで済む。
  */

  const DOW_LABEL = ['日', '月', '火', '水', '木', '金', '土'];

  /**
   * 日付ブロックを1つ足す。
   *
   * @param {string=} date 'YYYY-MM-DD'。省略時は「最後の日の翌日」
   * @param {Array<{start,end}>=} ranges 省略時は直前の日の時間帯を引き継ぐ
   */
  function addDayBlock(date, ranges) {
    const cfg = state.config;
    const blocks = $('dayList').children;
    const last = blocks.length > 0 ? blocks[blocks.length - 1] : null;

    if (!date) {
      const lastDate = last ? last.querySelector('.dayDate').value : '';
      date = lastDate ? App.addDays(lastDate, 1) : (BOOT.date || App.todayStr());
    }
    // 引き継ぐ時間帯。1つ目のブロックだけは表示時間帯を既定にする
    if (!ranges) {
      ranges = last ? readRangesOf(last) : [{ start: cfg.day_start, end: cfg.day_end }];
      ranges = ranges.filter(function (r) { return r.start && r.end; });
      if (ranges.length === 0) ranges = [{ start: cfg.day_start, end: cfg.day_end }];
    }

    const block = document.createElement('div');
    block.className = 'dayBlock';
    block.innerHTML =
      '<div class="dayBlock__head">' +
        '<input type="date" class="dayDate" value="' + esc(date) + '" aria-label="日付">' +
        '<span class="dayBlock__dow"></span>' +
        '<button type="button" class="btn btn--icon dayBlock__del" aria-label="この日を削除">×</button>' +
      '</div>' +
      '<div class="rangeList"></div>' +
      '<div class="rangeActions">' +
        '<button type="button" class="btn btn--small addRange">＋ 時間帯を追加</button>' +
        '<button type="button" class="btn btn--small allDay">終日OK</button>' +
      '</div>';

    $('dayList').appendChild(block);

    const dowEl = block.querySelector('.dayBlock__dow');
    const updateDow = function () {
      const v = block.querySelector('.dayDate').value;
      dowEl.textContent = v ? '(' + DOW_LABEL[App.dowOf(v)] + ')' : '';
    };
    block.querySelector('.dayDate').addEventListener('change', updateDow);
    updateDow();

    block.querySelector('.dayBlock__del').addEventListener('click', function () {
      block.remove();
      if ($('dayList').children.length === 0) addDayBlock();
      updateDayDeleteButtons();
    });

    block.querySelector('.addRange').addEventListener('click', function () {
      addRangeRow(block);
    });

    block.querySelector('.allDay').addEventListener('click', function () {
      block.querySelector('.rangeList').innerHTML = '';
      addRangeRow(block, cfg.day_start, cfg.day_end);
      toast('終日（' + cfg.day_start + '〜' + cfg.day_end + '）を入力しました');
    });

    ranges.forEach(function (r) { addRangeRow(block, r.start, r.end); });
    updateDayDeleteButtons();
    return block;
  }

  /** 日付ブロックが1つだけのときは削除ボタンを隠す */
  function updateDayDeleteButtons() {
    const blocks = $('dayList').children;
    Array.prototype.forEach.call(blocks, function (b) {
      b.querySelector('.dayBlock__del').hidden = blocks.length <= 1;
    });
  }

  /**
   * 時間帯の行を1つ足す。
   * 既定値は「前の行の終了時刻から」。連続で入力するときに打ち直す手間を減らす。
   *
   * 時刻はプルダウンではなく、時・分の直接入力（App.timeFields）。
   */
  function addRangeRow(block, start, end) {
    const cfg = state.config;
    const dayStart = toMin(cfg.day_start);
    const dayEnd = toMin(cfg.day_end);
    const list = block.querySelector('.rangeList');

    if (!start) {
      const rows = list.children;
      const last = rows.length > 0 ? rows[rows.length - 1] : null;
      const lastEnd = last ? App.readTimeFields(last.querySelector('.rangeEnd')) : '';
      const from = lastEnd ? toMin(lastEnd) : dayStart;
      start = toHHMM(Math.min(from, dayEnd - 60 > dayStart ? dayEnd - 60 : dayStart));
      end = toHHMM(Math.min(toMin(start) + 180, dayEnd));
    }

    const row = document.createElement('div');
    row.className = 'rangeRow';
    row.innerHTML =
      App.timeFields({ cls: 'rangeStart', value: start, label: '開始' }) +
      '<span class="rangeRow__sep">〜</span>' +
      App.timeFields({ cls: 'rangeEnd', value: end, label: '終了' }) +
      '<button type="button" class="btn btn--icon rangeRow__del" aria-label="この時間帯を削除">×</button>';

    row.querySelector('.rangeRow__del').addEventListener('click', function () {
      row.remove();
      if (list.children.length === 0) addRangeRow(block);
      updateDeleteButtons(block);
    });

    // 開始を後ろにずらしたら、終了もついてくる（終了 <= 開始 を作らせない）
    App.onTimeFieldsInput(row.querySelector('.rangeStart'), function () {
      const startVal = App.readTimeFields(row.querySelector('.rangeStart'));
      const endEl = row.querySelector('.rangeEnd');
      const endVal = App.readTimeFields(endEl);
      if (!startVal || !endVal) return;
      if (toMin(endVal) <= toMin(startVal)) {
        App.writeTimeFields(endEl, toHHMM(Math.min(toMin(startVal) + 60, 24 * 60 - 1)));
      }
    });

    list.appendChild(row);
    updateDeleteButtons(block);
  }

  /** 行が1つだけのときは削除ボタンを隠す（消せない行を押させない） */
  function updateDeleteButtons(block) {
    const rows = block.querySelector('.rangeList').children;
    Array.prototype.forEach.call(rows, function (row) {
      row.querySelector('.rangeRow__del').hidden = rows.length <= 1;
    });
  }

  /** 1つの日付ブロックの時間帯を読む */
  function readRangesOf(block) {
    return Array.prototype.map.call(block.querySelector('.rangeList').children, function (row) {
      return {
        start: App.readTimeFields(row.querySelector('.rangeStart')),
        end: App.readTimeFields(row.querySelector('.rangeEnd'))
      };
    });
  }

  /** 送信する形（日付と時間帯の配列） */
  function readDays() {
    return Array.prototype.map.call($('dayList').children, function (block) {
      return {
        date: block.querySelector('.dayDate').value,
        ranges: readRangesOf(block)
      };
    });
  }

  // ------------------------------------------------------------ 送信

  function showError(message) {
    const box = document.querySelector('.formError');
    box.textContent = message;
    box.hidden = false;
    box.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function clearError() {
    document.querySelector('.formError').hidden = true;
  }

  function submit() {
    if (state.busy) return;
    clearError();

    const payload = {
      name: $('f_name').value,
      contact: $('f_contact').value,
      type: state.proxy ? $('f_type').value : 'volunteer',
      days: readDays(),
      operator: state.proxy && $('f_operator') ? $('f_operator').value : ''
    };

    // 送信前の確認は入力補助。判定はサーバー側が本体
    if (!payload.name.trim()) {
      showError('お名前を入力してください。');
      $('f_name').focus();
      return;
    }

    const problem = findInputProblem(payload.days);
    if (problem) {
      showError(problem);
      return;
    }

    setBusy(true);
    call('submitAvailability', state.token, payload)
      .then(function (data) {
        showReceipt(data);
      })
      .catch(function (e) {
        showError(e.message);
        toast('登録できませんでした', true);
      })
      .then(function () { setBusy(false); });
  }

  /** 最初に見つかった入力の不備。無ければ null */
  function findInputProblem(days) {
    if (days.length === 0) return '入れる日を入力してください。';

    const seen = {};
    for (let i = 0; i < days.length; i++) {
      const d = days[i];
      if (!d.date) return '日付を入力してください。';
      if (seen[d.date]) return d.date + ' が重複しています。1つにまとめてください。';
      seen[d.date] = true;

      if (d.ranges.length === 0) return d.date + ' の時間帯を入力してください。';
      for (let j = 0; j < d.ranges.length; j++) {
        const r = d.ranges[j];
        if (!r.start || !r.end) {
          return d.date + ' の時間帯を入力してください（時は0〜23、分は0〜59）。';
        }
        if (toMin(r.end) <= toMin(r.start)) {
          return d.date + ' は終了時刻を開始時刻より後にしてください。';
        }
      }
    }
    return null;
  }

  function setBusy(on) {
    state.busy = on;
    $('submitBtn').disabled = on;
    $('submitBtn').textContent = on ? '登録しています…' : 'この内容で登録する';
  }

  // ------------------------------------------------------------ 控え

  /**
   * 送信後の控え。**入力内容をそのまま見せる**（design.md 4.3）。
   * 「送れたのか分からない」が最も多い問い合わせになるため、
   * 何がいつ登録されたのかを画面で確認できるようにする。
   */
  function showReceipt(data) {
    const days = data.days || [];
    const merged = days.some(function (d) { return d.entries.length < d.inputCount; });
    const allKnown = days.every(function (d) { return d.addedCount === 0; });

    const rows = days.map(function (d) {
      const times = d.entries.map(function (e) {
        return esc(e.start_time) + ' 〜 ' + esc(e.end_time);
      }).join('<br>');
      return '<div class="receipt__day">' +
        '<div class="receipt__date">' + esc(d.date) +
          '（' + DOW[App.dowOf(d.date)] + '）</div>' +
        '<div class="receipt__times">' + times + '</div>' +
      '</div>';
    }).join('');

    $('receipt').innerHTML =
      '<div class="receipt">' +
        '<p class="receipt__badge">登録できました</p>' +
        '<dl class="receipt__list">' +
          '<dt>お名前</dt><dd>' + esc(data.name) +
            (data.type === 'staff' ? '（職員）' : '') + '</dd>' +
          '<dt>入れる日と時間帯（' + days.length + '日）</dt>' +
          '<dd>' + rows + '</dd>' +
        '</dl>' +
        (merged ? '<p class="hint">重なっていた時間帯はひとつにまとめました。</p>' : '') +
        (allKnown ? '<p class="hint">この内容は登録済みでした。二重にはなっていません。</p>' : '') +
        '<p class="hint">この画面は控えです。閉じてしまっても登録は残ります。' +
          '変更したいときは、もう一度この画面から登録してください。</p>' +
        '<div class="receipt__actions">' +
          '<button type="button" class="btn" id="againMore">続けて登録する</button>' +
          (state.proxy ? '<button type="button" class="btn" id="againOther">別の人を入力</button>' : '') +
        '</div>' +
      '</div>';

    $('entryForm').hidden = true;
    $('receipt').hidden = false;
    window.scrollTo(0, 0);

    // 続けて登録するときは、最後に登録した日の翌日から始める
    const lastDate = days.length > 0 ? days[days.length - 1].date : '';
    $('againMore').addEventListener('click', function () {
      backToForm({ keepPerson: true, date: lastDate ? App.addDays(lastDate, 1) : '' });
    });
    if (state.proxy) {
      $('againOther').addEventListener('click', function () { backToForm({ keepPerson: false }); });
    }
  }

  /** 控えから入力画面へ戻す */
  function backToForm(opts) {
    if (!opts.keepPerson) {
      $('f_name').value = '';
      $('f_contact').value = '';
      if (state.proxy) $('f_type').value = 'volunteer';
    }

    $('dayList').innerHTML = '';
    addDayBlock(opts.date || '');
    clearError();

    $('receipt').hidden = true;
    $('entryForm').hidden = false;
    window.scrollTo(0, 0);
    if (!opts.keepPerson) $('f_name').focus();
  }

  // ------------------------------------------------------------ イベント

  $('entryForm').addEventListener('submit', function (e) {
    e.preventDefault();
    submit();
  });

  // 直前の日の時間帯を引き継いで、日付だけ翌日にする
  $('addDay').addEventListener('click', function () { addDayBlock(); });

  boot();
})();
</script>

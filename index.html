<!--
  index.html … 画面の骨組み

  CSS と JS は style.html / script.html に分けている（CLAUDE.md ファイル構成）。
  ビルド工程は持ち込まない。素の JS ＋ テンプレートリテラルで DOM を組む（gas.md 6）。

  初期描画は「ローディング表示 → サーバー呼び出し → 描画」の流れに統一する。
-->
<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('style'); ?>
</head>
<body>
  <header class="head">
    <div class="head__row">
      <div class="dateNav">
        <button type="button" class="btn btn--icon" id="prevDay" aria-label="前の日">‹</button>
        <div class="dateNav__label">
          <input type="date" id="datePicker" aria-label="日付">
          <span class="dateNav__dow" id="dateDow"></span>
        </div>
        <button type="button" class="btn btn--icon" id="nextDay" aria-label="次の日">›</button>
      </div>
      <div class="head__actions">
        <button type="button" class="btn btn--ghost" id="todayBtn">今日</button>
      </div>
    </div>

    <!-- 管理URL（?view=admin）で開いたときだけ表示される操作列 -->
    <div class="adminBar" id="adminBar" hidden>
      <div class="adminBar__spacer"></div>
      <button type="button" class="btn btn--ghost" id="placesBtn">場所</button>
    </div>
    <p class="adminBar__hint" id="assignHint" hidden>
      空いているところをタップすると、人を選んで時間を決めるだけで枠ができます。
      すでにある枠をタップすると、人を入れたり枠を編集したりできます。
      <strong>1つの枠に入れるのは1人まで</strong>です。同じ時間に複数人を置くときは場所を分けてください。
    </p>
  </header>

  <main id="main">
    <div class="loading" id="loading">読み込んでいます…</div>

    <!--
      同じ日を2つの見方で並べる。
        上 … 役割ごと（枠が埋まっているか）
        下 … 人ごと（誰がまだ空いているか）
      切り替えではなく上下に並べるのは、片方を見ながらもう片方を直す作業だから。
    -->
    <div id="sections" hidden>
      <section class="sec">
        <h2 class="sec__title">役割ごと</h2>
        <div id="board"></div>
      </section>

      <section class="sec">
        <h2 class="sec__title">人ごと</h2>
        <p class="legend">
          <span class="legend__item"><span class="legend__swatch legend__swatch--free"></span>入れる時間</span>
          <span class="legend__item"><span class="legend__swatch legend__swatch--busy"></span>割り当て済み</span>
          <span class="legend__item" id="unassignHint" hidden>青い帯をタップすると解除できます</span>
        </p>
        <div id="people"></div>
      </section>
    </div>
  </main>

  <!-- モーダル。中身は script.html が組み立てる -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close="1"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__head">
        <h2 class="modal__title" id="modalTitle"></h2>
        <button type="button" class="btn btn--icon" data-close="1" aria-label="閉じる">×</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
    // doGet が埋め込む初期値。業務データは含まない（描画は getDayBoard の結果で行う）
    const BOOT = <?!= toJsonLiteral_(boot); ?>;
  </script>
  <?!= include('common_script'); ?>
  <?!= include('script'); ?>
</body>
</html>

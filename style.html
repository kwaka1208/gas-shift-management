<style>
/*
  style.html … 画面のスタイル

  スマホでの利用が前提（要件 5）。基準はスマホ幅、広い画面は上書きで調整する。
  タップ対象は 44px 以上を確保する。ドラッグ&ドロップは使わない（要件 5）。
*/

:root {
  --fg: #1f2328;
  --fg-weak: #656d76;
  --bg: #f6f7f9;
  --panel: #ffffff;
  --line: #d9dde2;
  --grid: #e9ecef;
  --accent: #1a6fd4;
  --accent-weak: #e8f1fc;
  --danger: #b3261e;
  --slot-bg: #eef2f7;
  --slot-line: #b9c4d2;
  --res-free: #e6ebf1;
  --res-free-line: #ccd5df;

  /*
    役割の背景色。**淡い色だけを用意する。**
    黒い文字と、この上に重なる割り当ての帯（--slot-bg）が読める濃さに留めること。
    キーの一覧は config.js の PLACE_COLORS、名前は common_script.html の PLACE_COLOR_OPTIONS。
  */
  --tint-red: #fde8e8;
  --tint-orange: #fbeddc;
  --tint-yellow: #f9f3cf;
  --tint-green: #e4f3e2;
  --tint-blue: #e3edfb;
  --tint-purple: #eee7f8;
  --tint-gray: #e9ebee;
  --tint-brown: #efe6dc;

  /* 画面の左右の余白。狭い画面では小さく、広い画面では大きくする */
  --gutter: .75rem;

  --place-w: 6rem;
  --hour-w: 5rem;      /* 1時間あたりの最小幅。狭い画面では横スクロールになる */
  --block-h: 3.25rem;  /* 時刻・人数・氏名の3行が入る高さ */
  --radius: 8px;
}

* { box-sizing: border-box; }

/*
  display を指定した要素では、ブラウザ既定の [hidden]{display:none} が負けてしまう。
  hidden 属性で表示を切り替えている箇所（管理モード列・モーダル等）が常時表示になるため、
  ここで明示的に打ち消す。
*/
[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--fg);
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
}

/* ---------------------------------------------------------------- ヘッダー */

.head {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  padding: .5rem var(--gutter);
}

.head__row {
  display: flex;
  align-items: center;
  gap: .5rem;
  flex-wrap: wrap;
}

.head__actions {
  margin-left: auto;
  display: flex;
  gap: .375rem;
}

.dateNav {
  display: flex;
  align-items: center;
  gap: .25rem;
}

.dateNav__label {
  display: flex;
  align-items: baseline;
  gap: .375rem;
}

.dateNav__dow {
  font-size: .8125rem;
  color: var(--fg-weak);
  min-width: 2.5em;
}

input[type="date"] {
  font: inherit;
  font-size: 1rem;
  padding: .25rem .375rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  color: inherit;
  min-height: 2.25rem;
}

/* ------------------------------------------------------------ 管理モード列 */

.adminBar {
  display: flex;
  align-items: center;
  gap: .375rem;
  margin-top: .5rem;
  padding-top: .5rem;
  border-top: 1px dashed var(--line);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.adminBar__spacer { flex: 1 0 .25rem; }

.adminBar__hint {
  margin: .5rem 0 0;
  font-size: .8125rem;
  color: var(--fg-weak);
}

.toggle {
  display: inline-flex;
  align-items: center;
  gap: .375rem;
  white-space: nowrap;
  padding: .25rem .5rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  min-height: 2.25rem;
}

.toggle input { width: 1.1rem; height: 1.1rem; margin: 0; }
.toggle:has(input:checked) { background: var(--accent-weak); border-color: var(--accent); }

/* ------------------------------------------------------------------ ボタン */

.btn {
  font: inherit;
  color: inherit;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: .375rem .75rem;
  min-height: 2.25rem;
  cursor: pointer;
  white-space: nowrap;
}

.btn:disabled { opacity: .5; cursor: default; }
.btn--ghost { background: transparent; }
.btn--icon { padding: .375rem .625rem; font-size: 1.125rem; line-height: 1; }
.btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn--danger { color: var(--danger); border-color: #e6c3c0; }

/* -------------------------------------------------------------- 配置表本体 */

.loading, .empty {
  padding: 2rem 1rem;
  text-align: center;
  color: var(--fg-weak);
}

/*
  左右の余白は .board に持たせる。横スクロールの器（.board__scroll）ごと内側へ寄るため、
  役割の列の position: sticky は余白の内側の端に貼り付く（見た目が崩れない）。
*/
.board { padding: .5rem var(--gutter) 4rem; }

.board__scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

/*
  min-width: max-content が要点。これが無いと各行の幅がスクロール領域の幅どまりになり、
  役割の列に position: sticky が効かない（横スクロールで左へ流れてしまう）。
  width: 100% は、内容が狭いときに広い画面いっぱいへ広げるため。
*/
.board__inner {
  width: 100%;
  min-width: max-content;
}

.board__axisRow, .board__row { display: flex; align-items: stretch; }

/* 役割の列は横スクロールしても左に貼り付く */
.board__place, .board__corner {
  position: sticky;
  left: 0;
  z-index: 2;
  flex: 0 0 var(--place-w);
  width: var(--place-w);
  background: var(--bg);
  border-right: 1px solid var(--line);
  padding: .375rem .5rem;
  font-size: .8125rem;
  overflow-wrap: anywhere;
}

.board__corner { background: var(--bg); }

.board__place--off { color: var(--fg-weak); }

.board__place small {
  display: block;
  color: var(--fg-weak);
  font-size: .6875rem;
}

/*
  時間軸と割り当ての帯は同じ幅・同じ基準で並ぶ。
  1時間ごとの目盛りは背景のグラデーションで描く（10分刻みのセルを敷き詰めない）。
*/
.board__axis, .board__lanes {
  flex: 1 1 auto;
  position: relative;
  min-width: calc(var(--hours) * var(--hour-w));
}

.board__axis {
  height: 1.5rem;
  border-bottom: 1px solid var(--line);
}

.board__tick {
  position: absolute;
  top: 0;
  font-size: .6875rem;
  color: var(--fg-weak);
  transform: translateX(-50%);
  white-space: nowrap;
  pointer-events: none;
}

/* 両端の目盛りは、中央揃えのままだと画面外へはみ出す */
.board__tick--first { transform: none; }
.board__tick--last { transform: translateX(-100%); }

.board__row + .board__row { border-top: 1px solid var(--line); }

.board__lanes {
  background-image: linear-gradient(to right, var(--grid) 0 1px, transparent 1px);
  background-size: calc(100% / var(--hours)) 100%;
  padding: .25rem 0;
}

.board__lanes--editable,
.board__lanes--assignable { cursor: copy; }

/*
  役割ごとの背景色（data-color）。

  **役割名の欄とタイムラインの両方に敷く。** 役割名の列は横スクロールしても左に
  貼り付くので、片方だけ塗ると、スクロールしたときに色が途切れて見える。
  貼り付く列は下の行が透けてはいけないため、色は不透明のものを使うこと。

  人ごとのセクションも同じ .board__row を使うが、data-color が付かないので影響しない。
*/
.board__row[data-color="red"] { --place-tint: var(--tint-red); }
.board__row[data-color="orange"] { --place-tint: var(--tint-orange); }
.board__row[data-color="yellow"] { --place-tint: var(--tint-yellow); }
.board__row[data-color="green"] { --place-tint: var(--tint-green); }
.board__row[data-color="blue"] { --place-tint: var(--tint-blue); }
.board__row[data-color="purple"] { --place-tint: var(--tint-purple); }
.board__row[data-color="gray"] { --place-tint: var(--tint-gray); }
.board__row[data-color="brown"] { --place-tint: var(--tint-brown); }

.board__row[data-color] .board__place,
.board__row[data-color] .board__lanes { background-color: var(--place-tint); }

@media print {
  /* 背景色は既定で印刷されない。役割の色分けは印刷しても残す */
  .board__row[data-color] .board__place,
  .board__row[data-color] .board__lanes {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}

/* ------------------------------------------------------------ 割り当ての帯 */

.slot {
  position: absolute;
  height: var(--block-h);
  background: var(--slot-bg);
  border: 1px solid var(--slot-line);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  padding: .125rem .375rem;
  font-size: .75rem;
  line-height: 1.25;
  overflow: hidden;
  text-align: left;
  font-family: inherit;
  color: inherit;
  cursor: default;
}

.slot--editable, .slot--assignable { cursor: pointer; }
.slot--editable:hover, .slot--assignable:hover { background: #e4eaf1; }

/*
  前日から続いている帯。**この日に登録されたものではない**ことが一目で分かるよう、
  左端を破線にして淡くする。タップしても直接は直せない（前日へ移動する）。
*/
.slot--carried {
  background: transparent;
  border-style: dashed;
  border-left: 3px dashed var(--fg-weak);
  color: var(--fg-weak);
}

.slot__time { display: block; font-weight: 600; white-space: nowrap; }
.slot__note { display: block; color: var(--fg-weak); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }

/* 割り当てられた人の氏名。帯が狭いときは `…` で切れる */
.slot__names {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------------------------------------------------------------- 節 */

.sec { padding-top: .75rem; }
.sec + .sec { margin-top: 1.5rem; border-top: 1px solid var(--line); }

.sec__title {
  margin: 0;
  padding: 0 var(--gutter);
  font-size: .8125rem;
  font-weight: 600;
  color: var(--fg-weak);
}

/* ------------------------------------------------ 人ごとの一覧（people） */

/*
  配置表と同じタイムラインの骨組み（.board / .board__row / .board__lanes）を使い、
  中身だけ差し替える。縦が人、横が時間。
*/

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: .875rem;
  margin: .25rem 0 0;
  padding: 0 var(--gutter);
  font-size: .75rem;
  color: var(--fg-weak);
}

.legend__item { display: inline-flex; align-items: center; gap: .375rem; }

.legend__swatch {
  width: 1.5rem;
  height: .75rem;
  border-radius: 3px;
  display: inline-block;
}

.legend__swatch--free { background: var(--res-free); border: 1px solid var(--res-free-line); }
.legend__swatch--busy { background: var(--accent); }

.resSummary {
  display: flex;
  flex-wrap: wrap;
  gap: .25rem 1.25rem;
  padding: .625rem var(--gutter) 0;
  font-size: .8125rem;
  color: var(--fg-weak);
}

.resSummary b { color: var(--fg); font-size: 1rem; }

/* 氏名と時間の2行が入るので、役割の列より広く取る */
#people .board__place,
#people .board__corner {
  flex-basis: 8rem;
  width: 8rem;
}

/* 解除できることが分かるように（管理URLのときだけ付く） */
.res__busy--tappable { cursor: pointer; border: none; font-family: inherit; }
.res__busy--tappable:hover { filter: brightness(1.15); }

/* 1人1行。段を分ける必要はない（同じ人は同時間に1つしか入らない） */
.res__lanes { min-height: 2.75rem; }

.res__free,
.res__busy {
  position: absolute;
  top: .5rem;
  height: 1.75rem;
  border-radius: 4px;
}

/* 入れると申告された時間 */
.res__free {
  background: var(--res-free);
  border: 1px solid var(--res-free-line);
}

/* 割り当て済み。可用の帯に重ねて描く */
.res__busy {
  background: var(--accent);
  color: #fff;
  font-size: .6875rem;
  line-height: 1.75rem;
  padding: 0 .375rem;
  overflow: hidden;
  white-space: nowrap;
}

/* 申告の外に割り当てられている（design.md 6.5 no_availability） */
.res__busy--warn { background: var(--danger); }

.res__busyLabel { text-overflow: ellipsis; overflow: hidden; display: block; }

.res__idle { color: var(--accent); font-weight: 600; }
.res__warn { color: var(--danger); }

/* -------------------------------------------------------------- モーダル */

.modal { position: fixed; inset: 0; z-index: 50; }

.modal__backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, .35);
}

.modal__panel {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(32rem, 100%);
  max-height: 92vh;
  overflow-y: auto;
  background: var(--panel);
  border-radius: 12px 12px 0 0;
  padding-bottom: env(safe-area-inset-bottom);
}

/* 広い画面では余白を広げ、配置表が端から端まで伸びきらないようにする */
@media (min-width: 40rem) {
  :root { --gutter: 1.5rem; }
}

@media (min-width: 64rem) {
  :root { --gutter: 2.5rem; }
}

@media (min-width: 40rem) {
  .modal__panel {
    top: 50%;
    bottom: auto;
    transform: translate(-50%, -50%);
    border-radius: 12px;
  }
}

.modal__head {
  position: sticky;
  top: 0;
  background: var(--panel);
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .75rem 1rem;
  border-bottom: 1px solid var(--line);
}

.modal__title { margin: 0; font-size: 1rem; }
.modal__head .btn { margin-left: auto; }
.modal__body { padding: 1rem; }

/* ---------------------------------------------------------------- フォーム */

.field { margin-bottom: .875rem; }

.field > label {
  display: block;
  font-size: .8125rem;
  color: var(--fg-weak);
  margin-bottom: .25rem;
}

/* 入力の種類ごとに列挙すると漏れる（password が抜けて幅が崩れた）。まとめて指定する */
.field input,
.field select {
  font: inherit;
  width: 100%;
  padding: .5rem;
  min-height: 2.75rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  color: inherit;
}

/*
  時刻の入力（時・分の直接入力）。
  スマホでは数字キーボードが出るよう inputmode="numeric" を付けている。
  数値入力のスピナーは幅を食い、指では押しにくいので消す。
*/
.timeInput {
  display: inline-flex;
  align-items: center;
  gap: .25rem;
  width: 100%;
}

.timeInput input {
  font: inherit;
  width: 100%;
  min-width: 0;
  padding: .5rem .25rem;
  min-height: 2.75rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  color: inherit;
  text-align: center;
  font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}

.timeInput input::-webkit-outer-spin-button,
.timeInput input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.timeInput__sep { color: var(--fg-weak); }

.field--row { display: flex; gap: .625rem; }
.field--row > * { flex: 1; }

.formActions {
  display: flex;
  gap: .5rem;
  margin-top: 1.25rem;
  padding-top: .875rem;
  border-top: 1px solid var(--line);
}

.formActions__spacer { flex: 1; }

.formError {
  margin: 0 0 .875rem;
  padding: .625rem .75rem;
  background: #fdf0ef;
  border: 1px solid #e6c3c0;
  border-radius: var(--radius);
  color: var(--danger);
  font-size: .8125rem;
  white-space: pre-wrap;
}

.hint { font-size: .8125rem; color: var(--fg-weak); margin: .25rem 0 0; }

/* ------------------------------------------------------------ 画面下部の運営者表記 */

.pageFooter {
  margin: 1.5rem 0 0;
  padding-top: .75rem;
  border-top: 1px solid var(--line);
  color: var(--fg-weak);
  font-size: .8125rem;
}

.pageFooter__label { margin: 0; }
.pageFooter__org { margin: .125rem 0 0; }

/* ------------------------------------------------------------ 役割の一覧 */

.placeList { list-style: none; margin: 0 0 .75rem; padding: 0; }

.placeList li {
  display: flex;
  flex-direction: column;
  gap: .375rem;
  padding: .5rem 0;
  border-bottom: 1px solid var(--line);
}

.placeList__main {
  display: flex;
  align-items: center;
  gap: .5rem;
}

/* 色の選択。スマホでの誤タップを避けるため 44px を確保する（要件 5） */
.colorPick {
  display: flex;
  flex-wrap: wrap;
  gap: .25rem;
}

.colorPick__btn {
  flex: 0 0 auto;
  width: 2.75rem;
  height: 2.75rem;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  cursor: pointer;
}

.colorPick__btn--none {
  width: auto;
  min-width: 2.75rem;
  padding: 0 .5rem;
  font-size: .75rem;
  color: var(--fg-weak);
}

/* 選択中はふちを太くする。色そのものが薄いので、枠で分かるようにしている */
.colorPick__btn[aria-pressed="true"] {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-weak);
}

.placeList input[type="text"] { flex: 1; min-width: 0; }
.placeList .order { flex: 0 0 3.5rem; }

.placeList .toggle {
  border: none;
  padding: .25rem;
  font-size: .75rem;
  color: var(--fg-weak);
}

/* -------------------------------------------------------- 割り当てパネル */

.panelHead {
  margin: 0 0 .25rem;
  font-weight: 600;
}

.panelHead__staff {
  margin: 0 0 .5rem;
  font-size: .8125rem;
  color: var(--fg-weak);
}

.assignSec { margin-top: 1.25rem; }

.assignSec h3 {
  margin: 0 0 .375rem;
  font-size: .875rem;
  padding-bottom: .25rem;
  border-bottom: 1px solid var(--line);
}

.assignSec h4 {
  margin: .75rem 0 .25rem;
  font-size: .75rem;
  color: var(--fg-weak);
  font-weight: 600;
}

/* 部分可用は控えめに（design.md 4.2）。既定は閉じている */
.assignSec--sub summary {
  font-size: .8125rem;
  color: var(--fg-weak);
  cursor: pointer;
  padding: .375rem 0;
}

.empty--sm { padding: .75rem 0; text-align: left; font-size: .8125rem; }

/*
  絞り込みの入力欄。iOS の既定の見た目（内側の影・角丸）が
  .field input の枠と二重に見えるので消す。×印は残す
*/
.field input[type="search"] {
  -webkit-appearance: none;
  appearance: none;
}

.field input[type="search"]::-webkit-search-cancel-button {
  -webkit-appearance: searchfield-cancel-button;
}

/* 見出しとリストの箱。絞り込みで空になったら箱ごと隠す */
.pickGroup:first-of-type h4 { margin-top: 0; }

.pList { list-style: none; margin: 0; padding: 0; }

/*
  行そのものをタップ対象にする。指で押しやすいよう 44px を確保する（要件 5）。
*/
.pRow {
  display: flex;
  align-items: center;
  gap: .5rem;
  width: 100%;
  min-height: 2.75rem;
  padding: .375rem .25rem;
  border: none;
  border-bottom: 1px solid var(--line);
  background: transparent;
  font: inherit;
  color: inherit;
  text-align: left;
}

.pRow--pick { cursor: pointer; }
.pRow--pick:hover { background: var(--accent-weak); }
.pRow--pick:disabled { opacity: .5; cursor: default; }

.pName { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }

/* 氏名の下に添える性別・年齢。管理URLで開いたときだけ入る */
.pMeta {
  display: block;
  font-size: .75rem;
  color: var(--fg-weak);
}

.pLoad {
  flex: 0 0 auto;
  font-size: .75rem;
  color: var(--fg-weak);
  white-space: nowrap;
}

.pAdd {
  flex: 0 0 auto;
  color: var(--accent);
  font-size: 1.125rem;
  line-height: 1;
}

.pTag {
  flex: 0 0 auto;
  font-size: .6875rem;
  color: var(--fg-weak);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 .25rem;
  white-space: nowrap;
}

.pTag--staff { color: var(--accent); border-color: var(--accent); }

.pPending { flex: 0 0 auto; font-size: .75rem; color: var(--fg-weak); }

.btn--small { min-height: 2rem; padding: .25rem .625rem; font-size: .8125rem; }

/* 割り当ての編集（パネル上部） */
.slotEditActions {
  display: flex;

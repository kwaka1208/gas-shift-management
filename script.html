<script>
/*
  script.html … 画面のロジック

  方針（gas.md 6 / CLAUDE.md 開発ルール）
    - フレームワークを使わない。素の JS ＋ テンプレートリテラルで DOM を組む
    - サーバー呼び出しは画面単位で1回。日付を切り替えたときは getDayBoard だけを呼ぶ
    - google.script.run は必ず成功・失敗の両ハンドラを付ける
    - 送信中はボタンを無効化して二重送信を防ぐ
*/

(function () {
  'use strict';

  const DOW = ['日', '月', '火', '水', '木', '金', '土'];

  // ---------------------------------------------------------------- 状態
  /*
    閲覧URL（?view=board）と管理URL（?view=admin）で画面を分けている。
    **これは認証ではない。** トークンは共通なので、閲覧URLを知っていれば管理URLも作れる。
    サーバー側も閲覧トークンしか見ない。誤操作を防ぐための画面の分離にすぎない。
  */
  const state = {
    token: BOOT.token,
    date: BOOT.date,
    config: null,
    places: [],
    slots: [],
    assignments: [],
    people: [],
    availability: [],
    peopleById: {},
    // 管理URL（?view=admin）で開いたか。モードの切り替えは無い（design.md 2）
    adminMode: !!BOOT.admin,
    busy: false
  };

  const $ = function (id) { return document.getElementById(id); };

  // 共通処理は common_script.html（App）から借りる
  const call = App.call;
  const esc = App.esc;
  const toMin = App.toMin;
  const toHHMM = App.toHHMM;
  const addDays = App.addDays;
  const dowOf = App.dowOf;
  const todayStr = App.todayStr;
  const toast = App.toast;

  // ------------------------------------------------------------ モーダル

  function openModal(title, bodyHtml) {
    $('modalTitle').textContent = title;
    $('modalBody').innerHTML = bodyHtml;
    $('modal').hidden = false;
  }

  function closeModal() {
    $('modal').hidden = true;
    $('modalBody').innerHTML = '';
  }

  $('modal').addEventListener('click', function (e) {
    if (e.target.dataset && e.target.dataset.close) closeModal();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('modal').hidden) closeModal();
  });

  function showFormError(message) {
    const box = document.querySelector('#modalBody .formError');
    if (!box) return;
    box.textContent = message;
    box.hidden = false;
    box.scrollIntoView({ block: 'nearest' });
  }

  /** 送信中はモーダル内のボタンをすべて無効化する（二重送信の防止） */
  function setBusy(on) {
    state.busy = on;
    document.querySelectorAll('#modalBody button').forEach(function (b) { b.disabled = on; });
  }

  // ------------------------------------------------------------ 起動

  function boot() {
    $('datePicker').value = state.date;

    Promise.all([
      call('getBootstrap', state.token),
      call('getDayBoard', state.token, state.date)
    ]).then(function (res) {
      applyBootstrap(res[0]);
      applyDayBoard(res[1]);
      $('loading').hidden = true;
      $('sections').hidden = false;
      render();
    }).catch(function (e) {
      $('loading').textContent = e.message;
    });
  }

  function applyBootstrap(data) {
    state.config = data.config;
    state.places = data.places;
  }

  /*
    getDayBoard はその日の描画と候補者計算に必要な全部を1回で返す（CLAUDE.md 開発ルール）。
    候補者の絞り込みはここから先、クライアント側だけで計算する。サーバーへ聞き直さない。
  */
  function applyDayBoard(data) {
    state.date = data.date;
    state.slots = data.slots;
    state.assignments = data.assignments || [];
    state.people = data.people || [];
    state.availability = data.availability || [];
    indexPeople();
  }

  function indexPeople() {
    const map = {};
    state.people.forEach(function (p) { map[p.id] = p; });
    state.peopleById = map;
  }

  /** 指定日を読み込み直す */
  function loadDay(date) {
    $('loading').textContent = '読み込んでいます…';
    $('loading').hidden = false;
    $('sections').hidden = true;
    return call('getDayBoard', state.token, date).then(function (data) {
      applyDayBoard(data);
      $('datePicker').value = state.date;
      $('loading').hidden = true;
      $('sections').hidden = false;
      render();
    }).catch(function (e) {
      $('loading').textContent = e.message;
      toast(e.message, true);
    });
  }

  // ------------------------------------------------------------ 描画

  function render() {
    renderHeader();
    renderBoard();
    renderPeople();
  }

  function renderHeader() {
    $('dateDow').textContent = '(' + DOW[dowOf(state.date)] + ')';
    $('adminBar').hidden = !state.adminMode;
    $('assignHint').hidden = !state.adminMode;
    $('unassignHint').hidden = !state.adminMode;
  }

  /**
   * 配置表を描く。
   *
   * **10分刻みのセルを敷き詰めない。** 目盛りは背景で描き、枠は開始・終了から
   * 幅を計算して絶対配置する（roadmap Phase 1 受け入れ条件）。
   */
  function renderBoard() {
    const cfg = state.config;
    const dayStart = toMin(cfg.day_start);
    const dayEnd = toMin(cfg.day_end);
    const total = dayEnd - dayStart;

    if (total <= 0) {
      $('board').innerHTML = '<p class="empty">表示時間帯の設定が正しくありません（_config の day_start / day_end）。</p>';
      return;
    }

    const places = visiblePlaces();
    if (places.length === 0) {
      $('board').innerHTML = '<p class="empty">場所が登録されていません。' +
        (state.adminMode ? '「場所」から登録してください。' : '') + '</p>';
      return;
    }

    const slotsByPlace = {};
    state.slots.forEach(function (s) {
      (slotsByPlace[s.place_id] = slotsByPlace[s.place_id] || []).push(s);
    });

    const rows = places.map(function (p) {
      return renderPlaceRow(p, slotsByPlace[p.id] || [], dayStart, total);
    }).join('');

    $('board').innerHTML =
      '<div class="board">' +
        '<div class="board__scroll">' +
          '<div class="board__inner" style="--hours:' + (total / 60) + '">' +
            '<div class="board__axisRow">' +
              '<div class="board__corner"></div>' +
              '<div class="board__axis">' + renderTicks(dayStart, dayEnd, total) + '</div>' +
            '</div>' +
            rows +
          '</div>' +
        '</div>' +
      '</div>';

    /*
      **必ず #board の中だけを探すこと。** 人ごとのセクションも同じ骨組み
      （.board__lanes）を使っているため、document 全体から拾うと、人の行を
      タップしたときに枠の作成画面が開いてしまう。
    */
    if (state.adminMode) {
      $('board').querySelectorAll('.board__lanes').forEach(function (el) {
        el.addEventListener('click', onLanesClickAssign);
      });
      $('board').querySelectorAll('.slot--assignable').forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.stopPropagation();
          // 仮想の枠には割り当てパネルを開けない（枠の実体が無いため）。
          // 人を選ぶ画面へ進み、登録した時点で枠が生まれる
          if (isVirtualId(el.dataset.id)) openNewAssignPanel(el.dataset.place, presetOfEl(el));
          else openAssignPanel(el.dataset.id);
        });
      });
    }
  }

  /** サーバーが補った仮想の枠か（シートに行が無い） */
  function isVirtualId(id) {
    return String(id).indexOf('virtual:') === 0;
  }

  function presetOfEl(el) {
    return {
      place_id: el.dataset.place,
      start_time: el.dataset.start,
      end_time: el.dataset.end
    };
  }

  /**
   * シートに実在する枠だけ。
   * **saveSlots へ送る前に必ずこれを通す。** 仮想の枠を混ぜると
   * 「存在しない枠です」と拒否される。
   */
  function realSlots() {
    return state.slots.filter(function (s) { return !s.virtual; });
  }

  /** 表示する場所。廃止済みでも、その日の枠が残っていれば表示する */
  function visiblePlaces() {
    const used = {};
    state.slots.forEach(function (s) { used[s.place_id] = true; });
    return state.places.filter(function (p) { return p.active || used[p.id]; });
  }

  function renderTicks(dayStart, dayEnd, total) {
    let html = '';
    for (let m = dayStart; m <= dayEnd; m += 60) {
      const left = (m - dayStart) / total * 100;
      // 両端はラベルが画面外へはみ出すため、寄せ方を変える
      const edge = m === dayStart ? ' board__tick--first'
        : (m + 60 > dayEnd ? ' board__tick--last' : '');
      html += '<span class="board__tick' + edge +
        '" style="left:' + left + '%">' + toHHMM(m) + '</span>';
    }
    return html;
  }

  // ------------------------------------------------------- 人ごとの一覧

  /*
    配置表と同じデータを「人ごと」に並べ替えて見せる。
    上の表で枠の埋まり具合を見て、下の表で誰がまだ空いているかを探す、という使い方。

    **サーバーへは問い合わせない。** getDayBoard が返した同じ state から組み立てる。
  */

  /**
   * 人ごとに「入れる時間」と「割り当て済み」を集める。
   *
   * 出すのは**その日に関わりのある人だけ**（申告した人、または割り当てのある人）。
   * 継続参加者でも申告が無ければ出さない。空行が並ぶと、空いている人を探すという
   * 本来の目的が埋もれるため。
   */
  function buildPeopleRows() {
    const byPerson = {};
    const ensure = function (personId) {
      if (!byPerson[personId]) byPerson[personId] = { personId: personId, free: [], busy: [] };
      return byPerson[personId];
    };

    state.availability.forEach(function (a) {
      ensure(a.person_id).free.push({
        start: toMin(a.start_time),
        end: toMin(a.end_time),
        virtual: a.virtual === true
      });
    });

    state.assignments.forEach(function (a) {
      const s = slotOf(a.slot_id);
      if (!s) return;
      ensure(a.person_id).busy.push({
        assignmentId: a.id,
        start: toMin(s.start_time),
        end: toMin(s.end_time),
        place: placeNameOf(s.place_id),
        time: s.start_time + '–' + s.end_time
      });
    });

    return Object.keys(byPerson).map(function (personId) {
      const row = byPerson[personId];
      row.person = personOf(personId) ||
        { id: personId, name: '(不明な人)', type: 'volunteer', kana: '' };
      row.freeMin = totalMinutes(row.free);
      row.busyMin = totalMinutes(row.busy);
      // 申告の外に割り当てられている人（design.md 6.5 no_availability の予告）
      row.outside = row.busy.filter(function (b) { return !coveredByAny(row.free, b); }).length;
      row.free.sort(byStart);
      row.busy.sort(byStart);
      return row;
    }).sort(comparePeopleRows);
  }

  function byStart(a, b) { return a.start - b.start || a.end - b.end; }

  /** 重なりを取り除いた合計分数。二重に数えないための畳み込み */
  function totalMinutes(ranges) {
    const sorted = ranges.slice().sort(byStart);
    let total = 0;
    let cur = null;
    sorted.forEach(function (r) {
      if (cur && r.start <= cur.end) {
        if (r.end > cur.end) { total += r.end - cur.end; cur.end = r.end; }
      } else {
        total += r.end - r.start;
        cur = { start: r.start, end: r.end };
      }
    });
    return total;
  }

  /** その割り当てが、申告のどれかに収まっているか */
  function coveredByAny(free, busy) {
    return free.some(function (f) { return f.start <= busy.start && busy.end <= f.end; });
  }

  /**
   * まだ余裕のある人を上に出す。
   * 「あと誰に頼めるか」を探すための並びなので、割り当ての少ない人から見えた方が速い。
   * 同数ならボランティアを先に（design.md 6.3 の並びに合わせる）。
   */
  function comparePeopleRows(a, b) {
    if (a.busyMin !== b.busyMin) return a.busyMin - b.busyMin;
    const at = a.person.type === 'staff' ? 1 : 0;
    const bt = b.person.type === 'staff' ? 1 : 0;
    if (at !== bt) return at - bt;
    const ak = a.person.kana || a.person.name || '';
    const bk = b.person.kana || b.person.name || '';
    return String(ak).localeCompare(String(bk), 'ja');
  }

  function renderPeople() {
    const cfg = state.config;
    const dayStart = toMin(cfg.day_start);
    const dayEnd = toMin(cfg.day_end);
    const total = dayEnd - dayStart;
    if (total <= 0) {
      $('people').innerHTML = '';
      return;
    }

    const rows = buildPeopleRows();
    if (rows.length === 0) {
      $('people').innerHTML = '<p class="empty">この日に入れる人がまだ登録されていません。' +
        '応募フォームからの登録をお待ちください。</p>';
      return;
    }

    $('people').innerHTML =
      peopleSummaryHtml(rows) +
      '<div class="board">' +
        '<div class="board__scroll">' +
          '<div class="board__inner" style="--hours:' + (total / 60) + '">' +
            '<div class="board__axisRow">' +
              '<div class="board__corner"></div>' +
              '<div class="board__axis">' + renderTicks(dayStart, dayEnd, total) + '</div>' +
            '</div>' +
            rows.map(function (r) { return renderPersonRow(r, dayStart, total); }).join('') +
          '</div>' +
        '</div>' +
      '</div>';

    // 割り当ての帯をタップすると解除できる（#people の中だけを見る）
    if (state.adminMode) {
      $('people').querySelectorAll('[data-unassign]').forEach(function (el) {
        el.addEventListener('click', function () {
          openUnassignModal(el.dataset.unassign, el.dataset.who, el.dataset.what);
        });
      });
    }
  }

  /** その日ぜんたいの状況。個々の行を見る前に、足りているのかを掴めるようにする */
  function peopleSummaryHtml(rows) {
    const freeMin = rows.reduce(function (sum, r) { return sum + r.freeMin; }, 0);
    const busyMin = rows.reduce(function (sum, r) { return sum + r.busyMin; }, 0);
    const idle = rows.filter(function (r) { return r.busyMin === 0; }).length;

    return '<div class="resSummary">' +
      '<span><b>' + rows.length + '</b>人が登録</span>' +
      '<span>まだ割り当て無し <b>' + idle + '</b>人</span>' +
      '<span>割り当て <b>' + state.assignments.length + '</b>件</span>' +
      '<span>時間 <b>' + loadLabel(busyMin) + '</b> / ' + loadLabel(freeMin) + '</span>' +
    '</div>';
  }

  /**
   * 1人分の行。
   *
   * **可用の帯の上に、割り当ての帯を重ねて描く。** 申告した時間のうち、
   * どこが埋まってどこが空いているのかを、目で追わずに分かるようにするため。
   */
  function renderPersonRow(row, dayStart, total) {
    const person = row.person;

    const free = row.free.map(function (f) {
      const box = clipRange(f, dayStart, total);
      if (!box) return '';
      // 職員の既定勤務時間帯は本人の申告ではないので、区別が付くようにする
      return '<span class="res__free' + (f.virtual ? ' res__free--virtual' : '') + '"' +
        ' style="left:' + box.left + '%;width:' + box.width + '%"></span>';
    }).join('');

    const busy = row.busy.map(function (b) {
      const box = clipRange(b, dayStart, total);
      if (!box) return '';
      const outside = !coveredByAny(row.free, b);
      const label = b.place + ' ' + b.time;
      const tag = state.adminMode ? 'button' : 'span';
      return '<' + tag + (state.adminMode ? ' type="button"' : '') +
        ' class="res__busy' + (outside ? ' res__busy--warn' : '') +
          (state.adminMode ? ' res__busy--tappable' : '') + '"' +
        ' style="left:' + box.left + '%;width:' + box.width + '%"' +
        ' title="' + esc(label) + '"' +
        (state.adminMode
          ? ' data-unassign="' + esc(b.assignmentId) + '"' +
            ' data-who="' + esc(person.name) + '" data-what="' + esc(label) + '"'
          : '') +
        '><span class="res__busyLabel">' + esc(b.place) + '</span></' + tag + '>';
    }).join('');

    const note = row.busyMin === 0
      ? '<small class="res__idle">空き</small>'
      : '<small>' + loadLabel(row.busyMin) + ' / ' + loadLabel(row.freeMin) + '</small>';

    return '<div class="board__row">' +
      '<div class="board__place">' +
        esc(person.name) + (person.type === 'staff' ? '<small>職員</small>' : '') +
        note +
        (row.outside > 0 ? '<small class="res__warn">申告外 ' + row.outside + '件</small>' : '') +
      '</div>' +
      '<div class="board__lanes res__lanes">' + free + busy + '</div>' +
    '</div>';
  }

  /** 表示時間帯からはみ出した分を切り落とす。完全に外なら null */
  function clipRange(range, dayStart, total) {
    const dayEnd = dayStart + total;
    const start = Math.max(range.start, dayStart);
    const end = Math.min(range.end, dayEnd);
    if (end <= start) return null;
    return {
      left: (start - dayStart) / total * 100,
      width: (end - start) / total * 100
    };
  }

  /**
   * 人ごとの一覧からの解除。
   *
   * 割り当てパネルの解除と違い、**先に確認を挟む。**
   * 帯は小さく、指が触れただけで人が消えると気付けないため。
   */
  function openUnassignModal(assignmentId, who, what) {
    openModal('割り当てを解除',
      '<p class="formError" hidden></p>' +
      '<p class="panelHead">' + esc(who) + 'さん</p>' +
      '<p>' + esc(what) + '</p>' +
      '<p class="hint">枠は残ります。この人だけを外します。</p>' +
      '<div class="formActions"><div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">やめる</button>' +
        '<button type="button" class="btn btn--danger" id="u_run">解除する</button>' +
      '</div>');

    $('u_run').addEventListener('click', function () {
      if (state.busy) return;
      setBusy(true);
      call('unassign', state.token, assignmentId)
        .then(function () {
          state.assignments = state.assignments.filter(function (a) { return a.id !== assignmentId; });
          closeModal();
          renderBoard();
          renderPeople();
          toast('解除しました');
        })
        .catch(function (e) {
          showFormError(e.message);
        })
        .then(function () { setBusy(false); });
    });
  }

  function renderPlaceRow(place, slots, dayStart, total) {
    const dayEnd = dayStart + total;
    const inRange = [];
    let outCount = 0;

    slots.forEach(function (s) {
      if (toMin(s.end_time) <= dayStart || toMin(s.start_time) >= dayEnd) outCount++;
      else inRange.push(s);
    });

    const lanes = assignLanes(inRange);
    const laneCount = Math.max(1, lanes.count);
    const minHeight = 'calc(.5rem + ' + laneCount + ' * var(--block-h) + ' + (laneCount - 1) + ' * .25rem)';

    const blocks = lanes.items.map(function (item) {
      return renderSlot(item.slot, item.lane, dayStart, total);
    }).join('');

    // 空いているところをタップすると、人を選んで枠を作れる
    const assignable = state.adminMode;

    return '<div class="board__row">' +
      '<div class="board__place' + (place.active ? '' : ' board__place--off') + '">' +
        esc(place.name) +
        (place.active ? '' : '<small>（廃止）</small>') +
        (outCount > 0 ? '<small>表示範囲外 ' + outCount + '件</small>' : '') +
      '</div>' +
      '<div class="board__lanes' + (assignable ? ' board__lanes--assignable' : '') + '"' +
        ' data-place="' + esc(place.id) + '" style="min-height:' + minHeight + '">' +
        blocks +
      '</div>' +
    '</div>';
  }

  /**
   * 重なり合う枠を段に振り分ける。
   * 同じ場所に時間の重なる枠を作れる仕様のため、重ねずに読めるようにする。
   */
  function assignLanes(slots) {
    const sorted = slots.slice().sort(function (a, b) {
      if (a.start_time !== b.start_time) return a.start_time < b.start_time ? -1 : 1;
      return a.end_time < b.end_time ? -1 : 1;
    });
    const laneEnds = [];
    const items = sorted.map(function (s) {
      const start = toMin(s.start_time);
      const end = toMin(s.end_time);
      let lane = laneEnds.findIndex(function (e) { return e <= start; });
      if (lane === -1) {
        lane = laneEnds.length;
        laneEnds.push(end);
      } else {
        laneEnds[lane] = end;
      }
      return { slot: s, lane: lane };
    });
    return { items: items, count: laneEnds.length };
  }

  function renderSlot(slot, lane, dayStart, total) {
    const dayEnd = dayStart + total;
    const start = Math.max(toMin(slot.start_time), dayStart);
    const end = Math.min(toMin(slot.end_time), dayEnd);
    const left = (start - dayStart) / total * 100;
    const width = (end - start) / total * 100;
    const top = 'calc(.25rem + ' + lane + ' * (var(--block-h) + .25rem))';

    // 管理URLでは枠をタップすると割り当てパネルが開く
    const assignable = state.adminMode;
    const tag = assignable ? 'button' : 'div';
    // 仮想の枠（_config の既定時間帯。まだシートに無い）。人を入れた時点で実体になる
    const virtual = !!slot.virtual;

    const list = assignmentsOfSlot(slot.id);
    // **必要人数は画面に出さない**（場所単位で管理する方針）。名前が入っているかを見せる
    const meta = virtual ? '既定の枠' : (list.length === 0 ? '未割当' : list.length + '名');
    const names = list.map(function (a) {
      return personName(a.person_id) + (isStaff(a.person_id) ? '（職）' : '');
    }).join('、');

    return '<' + tag + (assignable ? ' type="button"' : '') +
      ' class="slot' + (assignable ? ' slot--assignable' : '') +
        (virtual ? ' slot--virtual' : '') + '"' +
      ' data-id="' + esc(slot.id) + '"' +
      ' data-place="' + esc(slot.place_id) + '"' +
      ' data-start="' + esc(slot.start_time) + '" data-end="' + esc(slot.end_time) + '"' +
      ' style="left:' + left + '%;width:' + width + '%;top:' + top + '">' +
      '<span class="slot__time">' + esc(slot.start_time) + '–' + esc(slot.end_time) + '</span>' +
      '<span class="slot__meta">' + esc(meta) +
        (slot.note ? ' <span class="slot__note">' + esc(slot.note) + '</span>' : '') +
      '</span>' +
      (names ? '<span class="slot__names">' + esc(names) + '</span>' : '') +
    '</' + tag + '>';
  }

  /**
   * 空いているところをタップしたら、そこに人を入れる（割り当てモード）。
   * 枠はこの操作の中で作られる。先に枠を用意しておく必要はない。
   */
  function onLanesClickAssign(e) {
    const preset = presetFromClick(e);
    if (preset) openNewAssignPanel(preset.place_id, preset);
  }

  /** タップ位置から、場所と仮の時間帯を割り出す */
  function presetFromClick(e) {
    if (e.target.closest('.slot')) return null;
    const el = e.currentTarget;
    const rect = el.getBoundingClientRect();
    const cfg = state.config;
    const dayStart = toMin(cfg.day_start);
    const dayEnd = toMin(cfg.day_end);
    const unit = cfg.slot_unit_minutes || 10;

    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    let start = dayStart + Math.floor((dayEnd - dayStart) * ratio / unit) * unit;
    if (start >= dayEnd) start = dayEnd - unit;
    const end = Math.min(start + 60, dayEnd);

    return {
      place_id: el.dataset.place,
      start_time: toHHMM(start),
      end_time: toHHMM(end)
    };
  }

  // ------------------------------------------------------- 枠の編集モーダル

  /** 時刻は時・分の直接入力。表示時間帯の外の時刻も入れられる */
  const timeFields = App.timeFields;
  const readTime = App.readTimeFields;

  function placeOptions(selected) {
    return state.places.filter(function (p) { return p.active || p.id === selected; })
      .map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (p.id === selected ? ' selected' : '') + '>' +
          esc(p.name) + (p.active ? '' : '（廃止）') + '</option>';
      }).join('');
  }

  /**
   * その日の枠を丸ごと保存する。
   * 割り当てのある枠を消そうとした場合など、サーバー側で拒否されることがあるため、
   * 楽観的更新はせず、結果を受け取ってから描き直す。
   */
  function submitSlots(slots, successMessage) {
    if (state.busy) return;
    setBusy(true);
    call('saveSlots', state.token, state.date, slots)
      .then(function (data) {
        state.slots = data.slots;
        closeModal();
        render();
        toast(successMessage);
      })
      .catch(function (e) {
        showFormError(e.message);
      })
      .then(function () { setBusy(false); });
  }

  // ------------------------------------------------------- 場所の管理

  function openPlacesModal() {
    openModal('場所の管理',
      '<p class="formError" hidden></p>' +
      '<ul class="placeList" id="placeList">' + state.places.map(placeRowHtml).join('') + '</ul>' +
      '<button type="button" class="btn" id="p_add">＋ 場所を追加</button>' +
      '<p class="hint">チェックを外すと配置表に表示されなくなります。' +
        '過去の配置表を保つため、行そのものは残ります。</p>' +
      '<div class="formActions">' +
        '<div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">キャンセル</button>' +
        '<button type="button" class="btn btn--primary" id="p_save">保存</button>' +
      '</div>');

    $('p_add').addEventListener('click', function () {
      const order = $('placeList').children.length + 1;
      $('placeList').insertAdjacentHTML('beforeend',
        placeRowHtml({ id: '', name: '', sort_order: order, active: true }));
    });

    $('p_save').addEventListener('click', function () {
      if (state.busy) return;
      const places = Array.prototype.map.call($('placeList').children, function (li) {
        return {
          id: li.dataset.id,
          name: li.querySelector('.name').value,
          sort_order: li.querySelector('.order').value,
          active: li.querySelector('.active').checked
        };
      }).filter(function (p) { return p.id || p.name.trim() !== ''; });

      setBusy(true);
      call('savePlaces', state.token, places)
        .then(function (data) {
          state.places = data.places;
          closeModal();
          render();
          toast('保存しました');
        })
        .catch(function (e) {
          showFormError(e.message);
        })
        .then(function () { setBusy(false); });
    });
  }

  function placeRowHtml(p) {
    return '<li data-id="' + esc(p.id) + '">' +
      '<input type="number" class="order" value="' + Number(p.sort_order || 0) + '" aria-label="表示順">' +
      '<input type="text" class="name" value="' + esc(p.name) + '" placeholder="場所名" aria-label="場所名">' +
      '<label class="toggle"><input type="checkbox" class="active"' + (p.active ? ' checked' : '') +
        '><span>表示</span></label>' +
    '</li>';
  }

  // ------------------------------------------------------- 既定の枠を作る

  /**
   * 破線で表示されている既定の枠を、まとめて**実体にする**。
   *
   * 既定の枠は普段シートに書かれない（画面の上だけに存在する）。人を入れれば
   * その場で実体になるが、**誰も入っていない枠を先に残したいとき**はこれを使う。
   * 「あと2名ほしい」という不足を画面に残せるのは、実体のある枠だけ。
   *
   * 時間帯と必要人数は `_config` の `default_slot_start` / `default_slot_end` /
   * `default_slot_required` に従う。
   *
   * 保存は既存の saveSlots を使う（その日の一覧を丸ごと送る仕組み）。
   */
  function openDefaultSlotsModal() {
    const cfg = state.config;
    const start = cfg.default_slot_start || cfg.day_start;
    const end = cfg.default_slot_end || cfg.day_end;

    const places = state.places.filter(function (p) { return p.active; });
    // 同じ場所・同じ時間の枠が既に**実体として**あるなら作らない（二重に作らせない）
    const already = {};
    realSlots().forEach(function (s) {
      if (s.start_time === start && s.end_time === end) already[s.place_id] = true;
    });
    const targets = places.filter(function (p) { return !already[p.id]; });

    if (places.length === 0) {
      openModal('既定の枠を作る',
        '<p>場所が登録されていません。先に「場所」から登録してください。</p>' +
        '<div class="formActions"><div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">閉じる</button></div>');
      return;
    }

    openModal('既定の枠を作る',
      '<p class="formError" hidden></p>' +
      '<p class="panelHead">' + esc(state.date) + ' に ' + esc(start) + '–' + esc(end) + ' の枠を作ります</p>' +
      '<p class="hint">破線で出ている既定の枠を、シート上の枠として残します。' +
        '人を入れるだけなら、この操作は要りません（入れた時点で枠ができます）。</p>' +
      (targets.length === 0
        ? '<p class="empty empty--sm">すべての場所に、この時間帯の枠が既にあります。</p>'
        : '<ul class="pList">' + targets.map(function (p) {
            return '<li class="pRow"><span class="pName">' + esc(p.name) + '</span>' +
              '<span class="pLoad">' + esc(start) + '–' + esc(end) + '</span></li>';
          }).join('') + '</ul>' +
          '') +
      (Object.keys(already).length > 0
        ? '<p class="hint">同じ時間帯の枠が既にある場所は除いてあります。</p>' : '') +
      '<p class="hint">時間帯は _config の default_slot_start / default_slot_end に従います。' +
        '他の日にも同じ枠がほしいときは、作ったあとに「コピー」を使ってください。</p>' +
      '<div class="formActions"><div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">キャンセル</button>' +
        (targets.length === 0 ? ''
          : '<button type="button" class="btn btn--primary" id="d_run">作成</button>') +
      '</div>');

    if (targets.length === 0) return;

    $('d_run').addEventListener('click', function () {
      const added = targets.map(function (p) {
        return {
          id: '',
          place_id: p.id,
          start_time: start,
          end_time: end,
          // 人数は画面で扱わない。_config の既定値をそのまま入れる
          required_count: cfg.default_slot_required || 1,
          staff_required: 0,
          note: ''
        };
      });
      submitSlots(realSlots().concat(added), added.length + '件の枠を作りました');
    });
  }

  // ------------------------------------------------------------ 割り当て

  /*
    候補者の抽出（design.md 6.3）は、この節で**クライアント側に閉じている**。
    getDayBoard が返したその日のデータだけで計算し、パネルを開くたびにサーバーへ
    問い合わせない（CLAUDE.md 開発ルール）。ただし保存時はサーバー側が同じ検証をやり直す。
  */

  function assignmentsOfSlot(slotId) {
    return state.assignments.filter(function (a) { return a.slot_id === slotId; });
  }

  function personOf(personId) {
    return state.peopleById[personId] || null;
  }

  function personName(personId) {
    const p = personOf(personId);
    return p ? p.name : '(不明な人)';
  }

  function isStaff(personId) {
    const p = personOf(personId);
    return !!p && p.type === 'staff';
  }

  function slotOf(slotId) {
    return state.slots.filter(function (s) { return s.id === slotId; })[0] || null;
  }

  function placeNameOf(placeId) {
    const p = state.places.filter(function (x) { return x.id === placeId; })[0];
    return p ? p.name : '(不明な場所)';
  }

  /** 半開区間 [aStart, aEnd) と [bStart, bEnd)。接するだけは重ならない（design.md 6.1） */
  function overlapsRange(aStart, aEnd, bStart, bEnd) {
    return aStart < bEnd && bStart < aEnd;
  }

  /** person_id → 可用時間帯（分）。職員の既定勤務時間帯はサーバーが補って返している */
  function availabilityByPerson() {
    const map = {};
    state.availability.forEach(function (a) {
      (map[a.person_id] = map[a.person_id] || [])
        .push({ start: toMin(a.start_time), end: toMin(a.end_time) });
    });
    return map;
  }

  /** person_id → その日の割り当て合計分数。候補者の並べ替えに使う */
  function loadByPerson() {
    const map = {};
    state.assignments.forEach(function (a) {
      const s = slotOf(a.slot_id);
      if (!s) return;
      map[a.person_id] = (map[a.person_id] || 0) + (toMin(s.end_time) - toMin(s.start_time));
    });
    return map;
  }

  /**
   * 枠に対する候補者を求める（design.md 6.3）。
   *
   * **人単位に集約してから判定する。** 1人が同じ日に複数の可用性行を持てるため、
   * 行単位で判定すると同じ人が完全候補と部分候補の両方に出る。
   */
  function candidatesFor(slot) {
    const start = toMin(slot.start_time);
    const end = toMin(slot.end_time);
    const avail = availabilityByPerson();
    const load = loadByPerson();

    const assignedHere = {};
    assignmentsOfSlot(slot.id).forEach(function (a) { assignedHere[a.person_id] = true; });

    // 同じ時間に別の場所へ入っている人は候補に出さない（ダブルブッキング防止）
    const busy = {};
    state.assignments.forEach(function (a) {
      if (a.slot_id === slot.id) return;
      const s = slotOf(a.slot_id);
      if (!s) return;
      if (overlapsRange(start, end, toMin(s.start_time), toMin(s.end_time))) busy[a.person_id] = true;
    });

    const full = [];
    const partial = [];

    state.people.forEach(function (p) {
      if (p.merged_into) return;      // 名寄せ元は出さない（統合先が出る）
      if (assignedHere[p.id]) return;
      if (busy[p.id]) return;

      const ranges = avail[p.id] || [];
      const covering = ranges.some(function (r) { return r.start <= start && end <= r.end; });
      const row = { person: p, load: load[p.id] || 0 };

      if (covering) {
        full.push(row);
        return;
      }
      const touching = ranges.filter(function (r) { return overlapsRange(start, end, r.start, r.end); });
      if (touching.length === 0) return;

      // 枠のうち実際に入れる部分だけを示す
      row.ranges = touching.map(function (r) {
        return toHHMM(Math.max(r.start, start)) + '–' + toHHMM(Math.min(r.end, end));
      }).join('、');
      // 時間指定で入れるときの初期値（枠と可用性が重なっている部分）
      row.preset_start = toHHMM(Math.max(touching[0].start, start));
      row.preset_end = toHHMM(Math.min(touching[0].end, end));
      partial.push(row);
    });

    full.sort(compareCandidates);
    partial.sort(compareCandidates);
    return { full: full, partial: partial };
  }

  /** ボランティアを先に、同種別では当日の割当が少ない順、次に かな／名前（design.md 6.3-5） */
  function compareCandidates(a, b) {
    const at = a.person.type === 'staff' ? 1 : 0;
    const bt = b.person.type === 'staff' ? 1 : 0;
    if (at !== bt) return at - bt;
    if (a.load !== b.load) return a.load - b.load;
    const ak = a.person.kana || a.person.name || '';
    const bk = b.person.kana || b.person.name || '';
    return String(ak).localeCompare(String(bk), 'ja');
  }

  function openAssignPanel(slotId) {
    if (!slotOf(slotId)) return;
    renderAssignPanel(slotId);
  }

  /** パネルは割り当て・解除のたびに組み直す。状態を持たせず、毎回 state から描く */
  /**
   * 枠のパネル。**上に枠そのものの編集、下に人の出し入れ**を並べる。
   *
   * 枠をタップしたらまず「場所と時間を直せる」ことが分かるように、編集欄を先頭に置く。
   * 人の追加・解除も同じパネルで完結させ、画面を行き来させない。
   */
  function renderAssignPanel(slotId) {
    const slot = slotOf(slotId);
    if (!slot) {
      closeModal();
      return;
    }

    const assigned = assignmentsOfSlot(slotId);
    const cand = candidatesFor(slot);

    // 割り当てのたびに組み直すため、そのままだと一覧の先頭へ戻ってしまう
    const panelEl = document.querySelector('.modal__panel');
    const keepScroll = ($('modal').hidden || !panelEl) ? 0 : panelEl.scrollTop;

    openModal(placeNameOf(slot.place_id) + ' ' + slot.start_time + '–' + slot.end_time,
      '<p class="formError" hidden></p>' +
      // --- 枠そのものの編集 ---
      '<div class="field"><label for="f_place">場所</label>' +
        '<select id="f_place">' + placeOptions(slot.place_id) + '</select></div>' +
      '<div class="field field--row">' +
        '<div><label>開始</label>' +
          timeFields({ id: 'f_start', value: slot.start_time, label: '開始' }) + '</div>' +
        '<div><label>終了</label>' +
          timeFields({ id: 'f_end', value: slot.end_time, label: '終了' }) + '</div>' +
      '</div>' +
      '<div class="field"><label for="f_note">メモ（任意）</label>' +
        '<input type="text" id="f_note" value="' + esc(slot.note) + '" maxlength="100"></div>' +
      '<div class="slotEditActions">' +
        '<button type="button" class="btn btn--danger" id="f_delete">この枠を削除</button>' +
        '<button type="button" class="btn btn--primary" id="f_save">枠を保存</button>' +
      '</div>' +
      // --- 人の出し入れ ---
      assignedSectionHtml(assigned) +
      candidateSectionHtml(cand.full) +
      partialSectionHtml(cand.partial) +
      // 枠の時間とは違う時間で入れたいとき。指定した時間の枠が新しくできる
      '<button type="button" class="btn btn--block btn--sub" id="a_time">時間を指定して入れる</button>' +
      '<div class="formActions"><div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">閉じる</button></div>');

    if (panelEl && keepScroll) panelEl.scrollTop = keepScroll;

    // --- 枠の保存・削除 ---
    $('f_save').addEventListener('click', function () {
      const edited = {
        id: slotId,
        place_id: $('f_place').value,
        start_time: readTime($('f_start')),
        end_time: readTime($('f_end')),
        // 人数は画面で扱わない（場所単位で管理する方針）。既存の値をそのまま残す
        required_count: slot.required_count,
        staff_required: slot.staff_required,
        note: $('f_note').value
      };
      // クライアント側の検証は入力補助。判定はサーバー側が本体
      if (!edited.start_time || !edited.end_time) {
        showFormError('時刻を入力してください（時は0〜23、分は0〜59）。');
        return;
      }
      if (toMin(edited.start_time) >= toMin(edited.end_time)) {
        showFormError('終了時刻は開始時刻より後にしてください。');
        return;
      }
      const next = realSlots().filter(function (s) { return s.id !== slotId; }).concat([edited]);
      submitSlots(next, '枠を保存しました');
    });

    $('f_delete').addEventListener('click', function () {
      const next = realSlots().filter(function (s) { return s.id !== slotId; });
      submitSlots(next, '枠を削除しました');
    });

    // --- 人の出し入れ ---
    $('modalBody').querySelectorAll('[data-assign]').forEach(function (el) {
      el.addEventListener('click', function () { doAssign(slotId, el.dataset.assign); });
    });
    $('modalBody').querySelectorAll('[data-unassign]').forEach(function (el) {
      el.addEventListener('click', function () { doUnassign(slotId, el.dataset.unassign); });
    });
    // 部分可用の人は、枠全体ではなく「入れる時間だけ」の枠を作って入れる
    $('modalBody').querySelectorAll('[data-pick]').forEach(function (el) {
      el.addEventListener('click', function () {
        openTimePickPanel(slot.place_id, el.dataset.pick, {
          start_time: el.dataset.start,
          end_time: el.dataset.end
        }, function () { renderAssignPanel(slotId); });
      });
    });
    $('a_time').addEventListener('click', function () {
      openNewAssignPanel(slot.place_id, {
        start_time: slot.start_time,
        end_time: slot.end_time
      }, function () { renderAssignPanel(slotId); });
    });
  }

  function assignedSectionHtml(assigned) {
    if (assigned.length === 0) {
      return '<section class="assignSec"><h3>割り当て済み (0)</h3>' +
        '<p class="empty empty--sm">まだ誰も割り当てられていません。</p></section>';
    }
    const rows = assigned.map(function (a) {
      // 送信中の行（楽観的更新で先に置いたもの）はまだ解除できない
      const pending = a.id.indexOf('tmp:') === 0;
      return '<li class="pRow pRow--assigned">' +
        '<span class="pName">' + esc(personName(a.person_id)) + '</span>' +
        '<span class="pTag' + (isStaff(a.person_id) ? ' pTag--staff' : '') + '">' +
          (isStaff(a.person_id) ? '職員' : 'ボランティア') + '</span>' +
        (pending
          ? '<span class="pPending">登録中…</span>'
          : '<button type="button" class="btn btn--small btn--danger" data-unassign="' + esc(a.id) + '">解除</button>') +
      '</li>';
    }).join('');
    return '<section class="assignSec"><h3>割り当て済み (' + assigned.length + ')</h3>' +
      '<ul class="pList">' + rows + '</ul></section>';
  }

  function candidateSectionHtml(rows) {
    if (rows.length === 0) {
      return '<section class="assignSec"><h3>割り当て可能 (0)</h3>' +
        '<p class="empty empty--sm">この時間に入れる人がいません。' +
        '可用性の登録状況を確認してください。</p></section>';
    }
    return '<section class="assignSec"><h3>割り当て可能 (' + rows.length + ')</h3>' +
      volunteerStaffHtml(rows, candidateRowHtml) +
    '</section>';
  }

  /** 候補者1行。押すと枠の時間そのままで割り当てる */
  function candidateRowHtml(row) {
    return pickRowHtml('data-assign="' + esc(row.person.id) + '"',
      row.person.name, '本日 ' + loadLabel(row.load));
  }

  /** 部分可用の1行。押すと「入れる時間だけ」の枠を作る画面へ進む */
  function partialRowHtml(row) {
    return pickRowHtml(
      'data-pick="' + esc(row.person.id) + '"' +
      ' data-start="' + esc(row.preset_start) + '"' +
      ' data-end="' + esc(row.preset_end) + '"',
      row.person.name, row.ranges + ' のみ');
  }

  function pickRowHtml(attrs, name, note) {
    return '<li><button type="button" class="pRow pRow--pick" ' + attrs + '>' +
      '<span class="pName">' + esc(name) + '</span>' +
      '<span class="pLoad">' + esc(note) + '</span>' +
      '<span class="pAdd">＋</span>' +
    '</button></li>';
  }

  function partialSectionHtml(rows) {
    if (rows.length === 0) return '';
    // 控えめに（design.md 4.2）。既定は閉じておき、必要なときだけ開く
    return '<details class="assignSec assignSec--sub">' +
      '<summary>一部の時間のみ可用 (' + rows.length + ')</summary>' +
      '<p class="hint">枠の一部しか入れない人です。選ぶと、その人が入れる時間の枠を作ります。</p>' +
      '<ul class="pList">' + rows.map(partialRowHtml).join('') + '</ul>' +
    '</details>';
  }

  function loadLabel(minutes) {
    if (!minutes) return '割当なし';
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return (h > 0 ? h + '時間' : '') + (m > 0 ? m + '分' : '');
  }

  /*
    割り当て・解除は楽観的更新（design.md 4.2）。
    先に画面を書き換え、サーバーが拒否したら元に戻す。管理者は実質1人ずつという前提に立つ。
  */

  function doAssign(slotId, personId) {
    if (state.busy) return;
    const tempId = 'tmp:' + Date.now();
    state.assignments = state.assignments.concat([{
      id: tempId, slot_id: slotId, person_id: personId, assigned_by: ''
    }]);
    refreshAssignView(slotId);

    setBusy(true);
    call('assign', state.token, slotId, personId)
      .then(function (data) {
        // サーバー側で名寄せが解決されることがあるので、行ごと置き換える
        state.assignments = state.assignments.map(function (a) {
          return a.id === tempId ? data.assignment : a;
        });
        refreshAssignView(slotId);
      })
      .catch(function (e) {
        state.assignments = state.assignments.filter(function (a) { return a.id !== tempId; });
        refreshAssignView(slotId);
        toast(e.message, true);
      })
      .then(function () { setBusy(false); });
  }

  function doUnassign(slotId, assignmentId) {
    if (state.busy) return;
    const removed = state.assignments.filter(function (a) { return a.id === assignmentId; })[0];
    if (!removed) return;

    state.assignments = state.assignments.filter(function (a) { return a.id !== assignmentId; });
    refreshAssignView(slotId);

    setBusy(true);
    call('unassign', state.token, assignmentId)
      .catch(function (e) {
        state.assignments = state.assignments.concat([removed]);
        refreshAssignView(slotId);
        toast(e.message, true);
      })
      .then(function () { setBusy(false); });
  }

  /** 3か所すべてを描き直す。1つでも欠けると数字が食い違う */
  function refreshAssignView(slotId) {
    renderBoard();
    renderPeople();
    renderAssignPanel(slotId);
  }

  // -------------------------------------------- 時間を指定して入れる（枠を作る）

  /*
    普段の運用はこちらが入口になる。**枠を先に作らなくてよい。**
    場所の空いているところをタップ → 人を選ぶ → 時間を決める → 枠ができて人が入る。

    順番は「人 → 時間」。先に人を選べば、その人が申告した時間帯をそのまま
    初期値にできる（「来られる時間をそのまま入れる」運用に合う）。
  */

  /**
   * 人を選ぶ画面。まだ枠が無いので、時間で候補者を絞り込まずにその日の全員を出す。
   *
   * @param {string} placeId
   * @param {Object} preset 仮の時間帯（タップ位置、または元の枠の時間）
   * @param {Function=} back 「戻る」で戻る先。省略時は閉じる
   */
  function openNewAssignPanel(placeId, preset, back) {
    const rows = dayCandidates(preset);

    openModal(placeNameOf(placeId) + ' に人を入れる',
      '<p class="panelHead">入れる人を選んでください</p>' +
      '<p class="hint">選んだあとに時間を決めます。枠はそのときに作られます。</p>' +
      (rows.length === 0
        ? '<p class="empty empty--sm">この日に入れる人がまだいません。' +
          '応募フォームからの登録をお待ちください。</p>'
        : '<section class="assignSec">' +
            volunteerStaffHtml(rows, dayCandidateRowHtml) +
          '</section>') +
      '<div class="formActions">' +
        (back ? '<button type="button" class="btn" id="n_back">戻る</button>' : '') +
        '<div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">閉じる</button>' +
      '</div>');

    if (back) $('n_back').addEventListener('click', back);

    $('modalBody').querySelectorAll('[data-pick]').forEach(function (el) {
      el.addEventListener('click', function () {
        openTimePickPanel(placeId, el.dataset.pick, {
          start_time: el.dataset.start,
          end_time: el.dataset.end
        }, function () { openNewAssignPanel(placeId, preset, back); });
      });
    });
  }

  /**
   * その日に入れる人の一覧（時間は未定）。
   *
   * 時間が決まっていないのでダブルブッキングの除外はできない。
   * 重なりは時間を決める画面で知らせ、最終的にはサーバー側が弾く。
   */
  function dayCandidates(preset) {
    const avail = availabilityByPerson();
    const load = loadByPerson();
    const hintStart = preset && preset.start_time ? toMin(preset.start_time) : null;
    const hintEnd = preset && preset.end_time ? toMin(preset.end_time) : null;

    const rows = [];
    state.people.forEach(function (p) {
      if (p.merged_into) return;
      const ranges = avail[p.id] || [];
      if (ranges.length === 0) return;   // その日の申告が無い人は出さない

      // タップした時間と重なる区間があればそれを、無ければ最初の区間を初期値にする
      const hit = (hintStart === null) ? null : ranges.filter(function (r) {
        return overlapsRange(hintStart, hintEnd, r.start, r.end);
      })[0];
      const base = hit || ranges[0];

      rows.push({
        person: p,
        load: load[p.id] || 0,
        preset_start: toHHMM(base.start),
        preset_end: toHHMM(base.end),
        ranges: ranges.map(function (r) { return toHHMM(r.start) + '–' + toHHMM(r.end); }).join('、')
      });
    });

    return rows.sort(compareCandidates);
  }

  /** ボランティアと職員に分けて並べる。ボランティア優先が画面から分かるようにする */
  function volunteerStaffHtml(rows, rowFn) {
    const volunteers = rows.filter(function (r) { return r.person.type !== 'staff'; });
    const staff = rows.filter(function (r) { return r.person.type === 'staff'; });
    return (volunteers.length > 0
        ? '<h4>ボランティア</h4><ul class="pList">' + volunteers.map(rowFn).join('') + '</ul>' : '') +
      (staff.length > 0
        ? '<h4>職員</h4><ul class="pList">' + staff.map(rowFn).join('') + '</ul>' : '');
  }

  function dayCandidateRowHtml(row) {
    return pickRowHtml(
      'data-pick="' + esc(row.person.id) + '"' +
      ' data-start="' + esc(row.preset_start) + '"' +
      ' data-end="' + esc(row.preset_end) + '"',
      row.person.name, row.ranges);
  }

  /**
   * 時間を決める画面。ここで登録すると、その時間の枠ができて人が入る。
   *
   * 初期値は選んだ人の申告時間帯。必要人数の既定は1名（＝その人で充足）で、
   * 「ここは3名ほしい」と分かっているときだけ増やす。
   */
  function openTimePickPanel(placeId, personId, preset, back) {
    const person = personOf(personId);
    if (!person) return;

    const cfg = state.config;
    const start = preset.start_time || cfg.day_start;
    const end = preset.end_time || cfg.day_end;

    openModal(placeNameOf(placeId) + ' / ' + person.name,
      '<p class="formError" hidden></p>' +
      '<p class="panelHead">' + esc(person.name) + 'さんを入れる時間</p>' +
      '<p class="hint">' + esc(availabilityLabel(personId)) + '</p>' +
      '<div class="field field--row">' +
        '<div><label>開始</label>' +
          timeFields({ id: 'n_start', value: start, label: '開始' }) + '</div>' +
        '<div><label>終了</label>' +
          timeFields({ id: 'n_end', value: end, label: '終了' }) + '</div>' +
      '</div>' +
      '<p class="warnLine" id="n_warn" hidden></p>' +
      '<div class="formActions">' +
        (back ? '<button type="button" class="btn" id="n_back">戻る</button>' : '') +
        '<div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">キャンセル</button>' +
        '<button type="button" class="btn btn--primary" id="n_save">この内容で登録</button>' +
      '</div>');

    if (back) $('n_back').addEventListener('click', back);

    const updateWarn = function () {
      const w = timeWarning(personId, readTime($('n_start')), readTime($('n_end')));
      $('n_warn').textContent = w;
      $('n_warn').hidden = !w;
    };
    App.onTimeFieldsInput($('n_start'), updateWarn);
    App.onTimeFieldsInput($('n_end'), updateWarn);
    updateWarn();

    $('n_save').addEventListener('click', function () {
      if (state.busy) return;
      const payload = {
        date: state.date,
        place_id: placeId,
        start_time: readTime($('n_start')),
        end_time: readTime($('n_end')),
        // 必要人数は画面から入力させない。`_config` の default_slot_required を使う
        person_id: personId
      };
      if (!payload.start_time || !payload.end_time) {
        showFormError('時刻を入力してください（時は0〜23、分は0〜59）。');
        return;
      }
      if (toMin(payload.start_time) >= toMin(payload.end_time)) {
        showFormError('終了時刻は開始時刻より後にしてください。');
        return;
      }
      submitNewAssign(payload);
    });
  }

  /** その人が申告している時間帯の説明 */
  function availabilityLabel(personId) {
    const ranges = availabilityByPerson()[personId] || [];
    if (ranges.length === 0) return 'この日の申告はありません。';
    return '申告: ' + ranges.map(function (r) {
      return toHHMM(r.start) + '–' + toHHMM(r.end);
    }).join('、');
  }

  /**
   * 選んだ時間についての注意書き。**登録は止めない。**
   * ダブルブッキングだけはサーバー側が弾くので、ここでは先に気づけるようにする。
   */
  function timeWarning(personId, startStr, endStr) {
    if (!startStr || !endStr) return '';   // 入力途中は何も言わない
    const start = toMin(startStr);
    const end = toMin(endStr);
    if (start >= end) return '';

    const conflict = state.assignments.filter(function (a) {
      if (a.person_id !== personId) return false;
      const s = slotOf(a.slot_id);
      return s && overlapsRange(start, end, toMin(s.start_time), toMin(s.end_time));
    })[0];
    if (conflict) {
      const s = slotOf(conflict.slot_id);
      return '同じ時間に「' + placeNameOf(s.place_id) + ' ' + s.start_time + '–' + s.end_time +
        '」へ割り当て済みです。このままでは登録できません。';
    }

    const ranges = availabilityByPerson()[personId] || [];
    const covered = ranges.some(function (r) { return r.start <= start && end <= r.end; });
    if (!covered) return '申告された時間の外です。登録はできますが、確認してください。';
    return '';
  }

  /**
   * 枠の作成と割り当てをまとめて送る。
   *
   * ここは**楽観的更新をしない。** 枠のIDがサーバーで決まるため、
   * 先に画面へ置いても差し替えが必要になり、失敗時の巻き戻しも複雑になる。
   */
  function submitNewAssign(payload) {
    setBusy(true);
    call('assignToNewSlot', state.token, payload)
      .then(function (data) {
        // 既にある枠が使い回されることもあるので、id で置き換えてから足す。
        // その場所の仮想の枠は、実体ができたので取り除く（二重に描かれるのを防ぐ）
        state.slots = state.slots.filter(function (s) {
          if (s.id === data.slot.id) return false;
          return !(s.virtual && s.place_id === data.slot.place_id);
        }).concat([data.slot]);
        state.assignments = state.assignments.concat([data.assignment]);
        renderBoard();
        renderPeople();
        // 続けて同じ枠へ人を足せるよう、その枠の割り当てパネルへ移る
        renderAssignPanel(data.slot.id);
        toast(data.slotCreated ? '枠を作って割り当てました' : '割り当てました');
      })
      .catch(function (e) {
        showFormError(e.message);
      })
      .then(function () { setBusy(false); });
  }

  // ------------------------------------------------------------ イベント

  $('prevDay').addEventListener('click', function () { loadDay(addDays(state.date, -1)); });
  $('nextDay').addEventListener('click', function () { loadDay(addDays(state.date, 1)); });
  $('todayBtn').addEventListener('click', function () { loadDay(todayStr()); });

  $('datePicker').addEventListener('change', function (e) {
    if (e.target.value) loadDay(e.target.value);
    else e.target.value = state.date;
  });

  /*
    管理用のボタンは管理URL（?view=admin）でしか存在しない。
    閲覧URLでは要素そのものが無いので、まとめて分岐の内側に置く。
  */
  if (state.adminMode) {
    $('placesBtn').addEventListener('click', openPlacesModal);
    $('defaultSlotsBtn').addEventListener('click', openDefaultSlotsModal);
  }

  boot();
})();
</script>

<script>
/*
  script.html … 画面のロジック

  方針（gas.md 6 / CLAUDE.md 開発ルール）
    - フレームワークを使わない。素の JS ＋ テンプレートリテラルで DOM を組む
    - サーバー呼び出しは画面単位で1回。日付を切り替えたときは getDayBoard だけを呼ぶ
    - google.script.run は必ず成功・失敗の両ハンドラを付ける
    - 送信中はボタンを無効化して二重送信を防ぐ
*/

(function () {
  'use strict';

  const DOW = ['日', '月', '火', '水', '木', '金', '土'];

  // ---------------------------------------------------------------- 状態
  /*
    閲覧URL（?view=board）と管理URL（?view=admin）で画面を分けている。
    **これは認証ではない。** トークンは共通なので、閲覧URLを知っていれば管理URLも作れる。
    サーバー側も閲覧トークンしか見ない。誤操作を防ぐための画面の分離にすぎない。
  */
  const state = {
    token: BOOT.token,
    date: BOOT.date,
    config: null,
    places: [],
    // 1件が「誰がどこにいつ入るか」を丸ごと持つ。**枠という概念は無い**（design.md 3）
    assignments: [],
    people: [],
    availability: [],
    peopleById: {},
    // 管理URL（?view=admin）で開いたか。モードの切り替えは無い（design.md 2）
    adminMode: !!BOOT.admin,
    busy: false
  };

  const $ = function (id) { return document.getElementById(id); };

  // 共通処理は common_script.html（App）から借りる
  const call = App.call;
  const esc = App.esc;
  const toMin = App.toMin;
  const toHHMM = App.toHHMM;
  // 時刻を人に見せるときは必ずこちらを通す。24時以降が「翌01:00」になる
  const tl = App.timeLabel;
  const ml = App.minLabel;
  const addDays = App.addDays;
  const dowOf = App.dowOf;
  const todayStr = App.todayStr;
  const toast = App.toast;

  // 印刷ビューと共有する計算は board_core.html（Board）から借りる。
  // **ここで再実装しないこと。** 画面と紙で結果が食い違う原因になる
  const coveredByAny = Board.coveredByAny;
  const clipRange = Board.clipRange;
  const assignLanes = Board.assignLanes;
  const renderTicks = Board.renderTicks;
  // 性別・年齢の表記（「女性 / 42歳」「女42」）。印刷ビューと同じ表記にする
  const personMeta = Board.personMeta;
  const personMetaShort = Board.personMetaShort;

  // ------------------------------------------------------------ モーダル

  function openModal(title, bodyHtml) {
    $('modalTitle').textContent = title;
    $('modalBody').innerHTML = bodyHtml;
    $('modal').hidden = false;
  }

  function closeModal() {
    $('modal').hidden = true;
    $('modalBody').innerHTML = '';
  }

  $('modal').addEventListener('click', function (e) {
    if (e.target.dataset && e.target.dataset.close) closeModal();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('modal').hidden) closeModal();
  });

  function showFormError(message) {
    const box = document.querySelector('#modalBody .formError');
    if (!box) return;
    box.textContent = message;
    box.hidden = false;
    box.scrollIntoView({ block: 'nearest' });
  }

  /** 送信中はモーダル内のボタンをすべて無効化する（二重送信の防止） */
  function setBusy(on) {
    state.busy = on;
    document.querySelectorAll('#modalBody button').forEach(function (b) { b.disabled = on; });
  }

  // ------------------------------------------------------------ 起動

  function boot() {
    $('datePicker').value = state.date;

    Promise.all([
      call('getBootstrap', state.token),
      call('getDayBoard', state.token, state.date, state.adminMode)
    ]).then(function (res) {
      applyBootstrap(res[0]);
      applyDayBoard(res[1]);
      $('loading').hidden = true;
      $('sections').hidden = false;
      render();
    }).catch(function (e) {
      $('loading').textContent = e.message;
    });
  }

  function applyBootstrap(data) {
    state.config = data.config;
    state.places = data.places;
  }

  /*
    getDayBoard はその日の描画と候補者計算に必要な全部を1回で返す（CLAUDE.md 開発ルール）。
    候補者の絞り込みはここから先、クライアント側だけで計算する。サーバーへ聞き直さない。
  */
  function applyDayBoard(data) {
    state.date = data.date;
    state.assignments = data.assignments || [];
    state.people = data.people || [];
    state.availability = data.availability || [];
    indexPeople();
  }

  function indexPeople() {
    const map = {};
    state.people.forEach(function (p) { map[p.id] = p; });
    state.peopleById = map;
  }

  /** 指定日を読み込み直す */
  function loadDay(date) {
    $('loading').textContent = '読み込んでいます…';
    $('loading').hidden = false;
    $('sections').hidden = true;
    return call('getDayBoard', state.token, date, state.adminMode).then(function (data) {
      applyDayBoard(data);
      $('datePicker').value = state.date;
      $('loading').hidden = true;
      $('sections').hidden = false;
      render();
    }).catch(function (e) {
      $('loading').textContent = e.message;
      toast(e.message, true);
    });
  }

  // ------------------------------------------------------------ 描画

  function render() {
    renderHeader();
    renderBoard();
    renderPeople();
  }

  function renderHeader() {
    $('dateDow').textContent = '(' + DOW[dowOf(state.date)] + ')';
    $('adminBar').hidden = !state.adminMode;
    $('assignHint').hidden = !state.adminMode;
    $('unassignHint').hidden = !state.adminMode;
  }

  /**
   * 配置表を描く。
   *
   * **10分刻みのセルを敷き詰めない。** 目盛りは背景で描き、割り当ての帯は
   * 開始・終了から幅を計算して絶対配置する（roadmap Phase 1 受け入れ条件）。
   */
  function renderBoard() {
    const cfg = state.config;
    const dayStart = toMin(cfg.day_start);
    const dayEnd = toMin(cfg.day_end);
    const total = dayEnd - dayStart;

    if (total <= 0) {
      $('board').innerHTML = '<p class="empty">表示時間帯の設定が正しくありません（_config の day_start / day_end）。</p>';
      return;
    }

    const places = visiblePlaces();
    if (places.length === 0) {
      $('board').innerHTML = '<p class="empty">場所が登録されていません。' +
        (state.adminMode ? '「場所」から登録してください。' : '') + '</p>';
      return;
    }

    const byPlace = {};
    state.assignments.forEach(function (a) {
      (byPlace[a.place_id] = byPlace[a.place_id] || []).push(a);
    });

    const rows = places.map(function (p) {
      return renderPlaceRow(p, byPlace[p.id] || [], dayStart, total);
    }).join('');

    $('board').innerHTML =
      renderOrphanWarning() +
      '<div class="board">' +
        '<div class="board__scroll">' +
          '<div class="board__inner" style="--hours:' + (total / 60) + '">' +
            '<div class="board__axisRow">' +
              '<div class="board__corner"></div>' +
              '<div class="board__axis">' + renderTicks(dayStart, dayEnd, total) + '</div>' +
            '</div>' +
            rows +
          '</div>' +
        '</div>' +
      '</div>';

    /*
      **必ず #board の中だけを探すこと。** 人ごとのセクションも同じ骨組み
      （.board__lanes）を使っているため、document 全体から拾うと、人の行を
      タップしたときに人を入れる画面が開いてしまう。
    */
    if (state.adminMode) {
      // --assignable が付いたレーンだけ。places に無い場所には入れさせない
      $('board').querySelectorAll('.board__lanes--assignable').forEach(function (el) {
        el.addEventListener('click', onLanesClickAssign);
      });
      $('board').querySelectorAll('.slot--assignable').forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.stopPropagation();
          openAssignmentPanel(el.dataset.id);
        });
      });
      // 前日から続いている帯は、直さずに前日へ移動させる
      $('board').querySelectorAll('.slot--carried').forEach(function (el) {
        el.addEventListener('click', function (e) {
          e.stopPropagation();
          openCarriedModal(el.dataset.id, el.dataset.carried);
        });
      });
    }
  }

  /** 表示する場所。廃止済みでも、その日の割り当てが残っていれば表示する */
  function visiblePlaces() {
    return Board.visiblePlaces(state.places, state.assignments);
  }

  /**
   * places に無い場所を指す割り当てがある、という注意書き。
   *
   * 管理モードのときだけ出す。閲覧者に見せても直しようがなく、不安にさせるだけ。
   */
  function renderOrphanWarning() {
    if (!state.adminMode) return '';
    const ids = orphanPlaceIds();
    if (ids.length === 0) return '';
    return '<p class="warnLine">places シートに無い場所を指す割り当てがあります' +
      '（place_id: ' + ids.map(esc).join(' / ') + '）。' +
      '「(不明な場所)」の行に出しています。タップして場所を選び直すか、解除してください。</p>';
  }

  /** その日の割り当てが指しているのに、places に無い place_id */
  function orphanPlaceIds() {
    return Board.orphanPlaceIds(state.places, state.assignments);
  }

  // ------------------------------------------------------- 人ごとの一覧

  /*
    配置表と同じデータを「人ごと」に並べ替えて見せる。
    上の表で場所の埋まり具合を見て、下の表で誰がまだ空いているかを探す、という使い方。

    **サーバーへは問い合わせない。** getDayBoard が返した同じ state から組み立てる。
  */

  /**
   * 人ごとに「入れる時間」と「割り当て済み」を集める。
   *
   * 集計そのものは board_core.html（Board）に置いてある。印刷ビューと同じ並び・
   * 同じ判定にするため。**ここで作り直さないこと。**
   */
  function buildPeopleRows() {
    return Board.buildPeopleRows(
      { availability: state.availability, assignments: state.assignments },
      { personOf: personOf, placeNameOf: placeNameOf });
  }

  function renderPeople() {
    const cfg = state.config;
    const dayStart = toMin(cfg.day_start);
    const dayEnd = toMin(cfg.day_end);
    const total = dayEnd - dayStart;
    if (total <= 0) {
      $('people').innerHTML = '';
      return;
    }

    const rows = buildPeopleRows();
    if (rows.length === 0) {
      $('people').innerHTML = '<p class="empty">この日に入れる人がまだ登録されていません。' +
        '応募フォームからの登録をお待ちください。</p>';
      return;
    }

    $('people').innerHTML =
      peopleSummaryHtml(rows) +
      '<div class="board">' +
        '<div class="board__scroll">' +
          '<div class="board__inner" style="--hours:' + (total / 60) + '">' +
            '<div class="board__axisRow">' +
              '<div class="board__corner"></div>' +
              '<div class="board__axis">' + renderTicks(dayStart, dayEnd, total) + '</div>' +
            '</div>' +
            rows.map(function (r) { return renderPersonRow(r, dayStart, total); }).join('') +
          '</div>' +
        '</div>' +
      '</div>';

    // 割り当ての帯をタップすると解除できる（#people の中だけを見る）
    if (state.adminMode) {
      $('people').querySelectorAll('[data-unassign]').forEach(function (el) {
        el.addEventListener('click', function () {
          openUnassignModal(el.dataset.unassign, el.dataset.who, el.dataset.what);
        });
      });
      $('people').querySelectorAll('[data-carried-id]').forEach(function (el) {
        el.addEventListener('click', function () {
          openCarriedModal(el.dataset.carriedId, el.dataset.carried);
        });
      });
    }
  }

  /** その日ぜんたいの状況。個々の行を見る前に、足りているのかを掴めるようにする */
  function peopleSummaryHtml(rows) {
    const idle = rows.filter(function (r) { return r.busyMin === 0; }).length;

    return '<div class="resSummary">' +
      '<span><b>' + rows.length + '</b>人が登録</span>' +
      '<span>まだ割り当て無し <b>' + idle + '</b>人</span>' +
      '<span>割り当て <b>' + state.assignments.length + '</b>件</span>' +
    '</div>';
  }

  /**
   * 1人分の行。
   *
   * **可用の帯の上に、割り当ての帯を重ねて描く。** 申告した時間のうち、
   * どこが埋まってどこが空いているのかを、目で追わずに分かるようにするため。
   */
  function renderPersonRow(row, dayStart, total) {
    const person = row.person;

    const free = row.free.map(function (f) {
      const box = clipRange(f, dayStart, total);
      if (!box) return '';
      return '<span class="res__free"' +
        ' style="left:' + box.left + '%;width:' + box.width + '%"></span>';
    }).join('');

    const busy = row.busy.map(function (b) {
      const box = clipRange(b, dayStart, total);
      if (!box) return '';
      const outside = !coveredByAny(row.free, b);
      const label = b.place + ' ' + b.time;
      // 場所ごとの帯と同じ詳細を出す（元の割り当てを引ければ）
      const src = assignmentOf(b.assignmentId);
      const carried = !!(src && src.carried_from);
      const tip = src
        ? assignmentTooltip(src) + (outside ? '\n⚠ 申告された時間の外です' : '')
        : label;
      const tag = state.adminMode ? 'button' : 'span';
      return '<' + tag + (state.adminMode ? ' type="button"' : '') +
        ' class="res__busy' + (outside ? ' res__busy--warn' : '') +
          (state.adminMode ? ' res__busy--tappable' : '') + '"' +
        ' style="left:' + box.left + '%;width:' + box.width + '%"' +
        ' title="' + esc(tip) + '"' +
        (state.adminMode && !carried
          ? ' data-unassign="' + esc(b.assignmentId) + '"' +
            ' data-who="' + esc(person.name) + '" data-what="' + esc(label) + '"'
          : '') +
        // 前日から続く帯は解除させず、元の日へ誘導する（場所ごとの帯と同じ扱い）
        (state.adminMode && carried
          ? ' data-carried-id="' + esc(b.assignmentId) + '"' +
            ' data-carried="' + esc(src.carried_from) + '"'
          : '') +
        '><span class="res__busyLabel">' + esc(b.place) + '</span></' + tag + '>';
    }).join('');

    // まだ誰にも割り当てていない人だけ印を出す。**割当済みの人には何も足さない**
    // （時間の合計は出さない。帯を見れば埋まり具合は分かる）
    const note = row.busyMin === 0 ? '<small class="res__idle">空き</small>' : '';

    const meta = personMeta(person);

    return '<div class="board__row">' +
      '<div class="board__place">' +
        esc(person.name) + (person.type === 'staff' ? '<small>職員</small>' : '') +
        (meta ? '<small>' + esc(meta) + '</small>' : '') +
        note +
        (row.outside > 0 ? '<small class="res__warn">申告外 ' + row.outside + '件</small>' : '') +
      '</div>' +
      '<div class="board__lanes res__lanes">' + free + busy + '</div>' +
    '</div>';
  }

  /**
   * 人ごとの一覧からの解除。
   *
   * **先に確認を挟む。** 帯は小さく、指が触れただけで人が消えると気付けないため。
   * （場所ごとの帯をタップしたときは編集パネルが開くので、誤操作にならない）
   */
  function openUnassignModal(assignmentId, who, what) {
    openModal('割り当てを解除',
      '<p class="formError" hidden></p>' +
      '<p class="panelHead">' + esc(who) + 'さん</p>' +
      '<p>' + esc(what) + '</p>' +
      '<p class="hint">この割り当てを取り消します。申告した時間帯は残ります。</p>' +
      '<div class="formActions"><div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">やめる</button>' +
        '<button type="button" class="btn btn--danger" id="u_run">解除する</button>' +
      '</div>');

    $('u_run').addEventListener('click', function () { doUnassign(assignmentId); });
  }

  function renderPlaceRow(place, rows, dayStart, total) {
    const dayEnd = dayStart + total;
    const inRange = [];
    let outCount = 0;

    rows.forEach(function (a) {
      if (toMin(a.end_time) <= dayStart || toMin(a.start_time) >= dayEnd) outCount++;
      else inRange.push(a);
    });

    const lanes = assignLanes(inRange);
    const laneCount = Math.max(1, lanes.count);
    const minHeight = 'calc(.5rem + ' + laneCount + ' * var(--block-h) + ' + (laneCount - 1) + ' * .25rem)';

    const blocks = lanes.items.map(function (item) {
      return renderAssignmentBlock(item.row, item.lane, dayStart, total);
    }).join('');

    // 空いているところをタップすると人を入れられる。
    // ただし places に無い場所には入れさせない（行き場の無い割り当てが増えるだけ）
    const assignable = state.adminMode && !place.missing;

    // 背景色は行そのものに付ける。場所名の欄とタイムラインの両方が同じ色になり、
    // 横スクロールしてもどの役割の行かを見失わない
    return '<div class="board__row"' +
        (place.color ? ' data-color="' + esc(place.color) + '"' : '') + '>' +
      '<div class="board__place' + (place.active ? '' : ' board__place--off') + '">' +
        esc(place.name) +
        (place.missing ? '<small>（places にありません）</small>'
          : (place.active ? '' : '<small>（廃止）</small>')) +
        (outCount > 0 ? '<small>表示範囲外 ' + outCount + '件</small>' : '') +
      '</div>' +
      '<div class="board__lanes' + (assignable ? ' board__lanes--assignable' : '') + '"' +
        ' data-place="' + esc(place.id) + '" style="min-height:' + minHeight + '">' +
        blocks +
      '</div>' +
    '</div>';
  }

  /**
   * ホバーで出す詳細（`title` 属性）。
   *
   * 帯は狭いと `…` で切れるうえ、性別・年齢は短縮形（`女42`）にしている。
   * **切れて読めなかったものを、そのまま読める形で補うのがここの役目。**
   * タップできない閲覧URLでも中身を確かめられる。
   *
   * `title` は改行を扱えるので、1項目1行で並べる。
   * スマホにはホバーが無いため、**ここにしか無い情報を置いてはいけない。**
   */
  function assignmentTooltip(row) {
    const person = personOf(row.person_id);
    const lines = [
      placeNameOf(row.place_id) + ' ' + tl(row.start_time) + '–' + tl(row.end_time),
      personName(row.person_id) + (isStaff(row.person_id) ? '（職員）' : '（ボランティア）')
    ];

    // 前日から続いている分は、元の日付と時刻を必ず出す。
    // この画面の時刻（02:00）とシートの値（26:00）が違うため、これが無いと探せない
    if (row.carried_from) {
      lines.push('前日 ' + row.carried_from + ' の割り当て（' +
        tl(row.origin_start_time) + '–' + tl(row.origin_end_time) + '）の続き');
    }

    const meta = person ? personMeta(person) : '';
    if (meta) lines.push(meta);

    // その人がその日に入れる時間帯。申告外に入れていないかを確かめられる
    lines.push(availabilityLabel(row.person_id, '申告なし'));

    if (row.note) lines.push('メモ: ' + row.note);

    return lines.join('\n');
  }

  /** 割り当て1件のブロック。**枠は無い。この帯そのものが1件の割り当て** */
  function renderAssignmentBlock(row, lane, dayStart, total) {
    const dayEnd = dayStart + total;
    const start = Math.max(toMin(row.start_time), dayStart);
    const end = Math.min(toMin(row.end_time), dayEnd);
    const left = (start - dayStart) / total * 100;
    const width = (end - start) / total * 100;
    const top = 'calc(.25rem + ' + lane + ' * (var(--block-h) + .25rem))';

    /*
      前日から続いている帯は**この画面では編集させない。**
      画面の時刻（02:00）と保存値（26:00）が違うため、ここで保存すると
      前日の割り当てが早朝の時刻で上書きされてしまう。
      タップしたら前日へ移動できるようにする。
    */
    const carried = !!row.carried_from;
    const editable = state.adminMode && !carried;
    const tag = (state.adminMode) ? 'button' : 'div';

    /*
      名前に性別・年齢と職員の印を括弧で添える（例:「鈴木 花子（女42）」）。
      帯は1行で `…` に切られるため、括弧の中身は短縮形にする（4.1.2）。
    */
    const tags = [personMetaShort(personOf(row.person_id)), isStaff(row.person_id) ? '職' : '']
      .filter(function (t) { return t; });
    const who = personName(row.person_id) +
      (tags.length > 0 ? '（' + tags.join('・') + '）' : '');

    return '<' + tag + (state.adminMode ? ' type="button"' : '') +
      ' class="slot' + (editable ? ' slot--assignable' : '') +
        (carried ? ' slot--carried' : '') + '"' +
      ' data-id="' + esc(row.id) + '"' +
      (carried ? ' data-carried="' + esc(row.carried_from) + '"' : '') +
      ' title="' + esc(assignmentTooltip(row)) + '"' +
      ' style="left:' + left + '%;width:' + width + '%;top:' + top + '">' +
      '<span class="slot__time">' + (carried ? '前日から ' : '') +
        esc(tl(row.start_time)) + '–' + esc(tl(row.end_time)) + '</span>' +
      '<span class="slot__names">' + esc(who) + '</span>' +
      (row.note ? '<span class="slot__note">' + esc(row.note) + '</span>' : '') +
    '</' + tag + '>';
  }

  /**
   * 空いているところをタップしたら、そこに人を入れる。
   * **これが唯一の割り当て経路。** 先に何かを用意しておく必要はない。
   */
  function onLanesClickAssign(e) {
    const preset = presetFromClick(e);
    if (preset) openNewAssignPanel(preset.place_id, preset);
  }

  /** タップ位置から、場所と仮の時間帯を割り出す */
  function presetFromClick(e) {
    if (e.target.closest('.slot')) return null;
    const el = e.currentTarget;
    const rect = el.getBoundingClientRect();
    const cfg = state.config;
    const dayStart = toMin(cfg.day_start);
    const dayEnd = toMin(cfg.day_end);
    const unit = cfg.slot_unit_minutes || 10;

    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    let start = dayStart + Math.floor((dayEnd - dayStart) * ratio / unit) * unit;
    if (start >= dayEnd) start = dayEnd - unit;
    const end = Math.min(start + 60, dayEnd);

    return {
      place_id: el.dataset.place,
      start_time: toHHMM(start),
      end_time: toHHMM(end)
    };
  }

  // ------------------------------------------------------------ 入力の部品

  /** 時刻は時・分の直接入力。表示時間帯の外の時刻も入れられる */
  const timeFields = App.timeFields;
  const readTime = App.readTimeFields;

  function placeOptions(selected) {
    /*
      places に無い場所の割り当てを開いたとき、選択肢が無いと**先頭の場所が選ばれた状態**に
      なり、保存すると黙って場所が変わってしまう。今の値をそのまま選択肢に出して、
      選び直すか解除するかを操作者に決めさせる。
    */
    const known = state.places.some(function (p) { return p.id === selected; });
    const head = (selected && !known)
      ? '<option value="' + esc(selected) + '" selected>(不明な場所)</option>'
      : '';

    return head + state.places.filter(function (p) { return p.active || p.id === selected; })
      .map(function (p) {
        return '<option value="' + esc(p.id) + '"' + (p.id === selected ? ' selected' : '') + '>' +
          esc(p.name) + (p.active ? '' : '（廃止）') + '</option>';
      }).join('');
  }

  // ------------------------------------------------------- 場所の管理

  function openPlacesModal() {
    openModal('場所の管理',
      '<p class="formError" hidden></p>' +
      '<ul class="placeList" id="placeList">' + state.places.map(placeRowHtml).join('') + '</ul>' +
      '<button type="button" class="btn" id="p_add">＋ 場所を追加</button>' +
      '<p class="hint">チェックを外すと配置表に表示されなくなります。' +
        '過去の配置表を保つため、行そのものは残ります。</p>' +
      '<p class="hint">色は「役割ごと」の行の背景になります。' +
        '同じ持ち場をまとめて見分けたいときに使ってください。</p>' +
      '<div class="formActions">' +
        '<div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">キャンセル</button>' +
        '<button type="button" class="btn btn--primary" id="p_save">保存</button>' +
      '</div>');

    // 色は行ごとに1つだけ。押されたボタンを選択状態にし、同じ行の他を外す
    $('placeList').addEventListener('click', function (e) {
      const btn = e.target.closest ? e.target.closest('.colorPick__btn') : null;
      if (!btn) return;
      const li = btn.closest('li');
      li.dataset.color = btn.dataset.color;
      li.querySelectorAll('.colorPick__btn').forEach(function (el) {
        el.setAttribute('aria-pressed', el === btn ? 'true' : 'false');
      });
    });

    $('p_add').addEventListener('click', function () {
      const order = $('placeList').children.length + 1;
      $('placeList').insertAdjacentHTML('beforeend',
        placeRowHtml({ id: '', name: '', sort_order: order, active: true }));
    });

    $('p_save').addEventListener('click', function () {
      if (state.busy) return;
      const places = Array.prototype.map.call($('placeList').children, function (li) {
        return {
          id: li.dataset.id,
          name: li.querySelector('.name').value,
          sort_order: li.querySelector('.order').value,
          active: li.querySelector('.active').checked,
          color: li.dataset.color || ''
        };
      }).filter(function (p) { return p.id || p.name.trim() !== ''; });

      setBusy(true);
      call('savePlaces', state.token, places)
        .then(function (data) {
          state.places = data.places;
          closeModal();
          render();
          toast('保存しました');
        })
        .catch(function (e) {
          showFormError(e.message);
        })
        .then(function () { setBusy(false); });
    });
  }

  /**
   * 場所1件の編集行。
   *
   * 選んだ色は `<li>` の data-color に持つ。**入力欄を増やさない**のは、
   * 保存時に読む場所を1か所（li）にまとめておくため。
   */
  function placeRowHtml(p) {
    const color = p.color || '';
    return '<li data-id="' + esc(p.id) + '" data-color="' + esc(color) + '">' +
      '<div class="placeList__main">' +
        '<input type="number" class="order" value="' + Number(p.sort_order || 0) + '" aria-label="表示順">' +
        '<input type="text" class="name" value="' + esc(p.name) + '" placeholder="場所名" aria-label="場所名">' +
        '<label class="toggle"><input type="checkbox" class="active"' + (p.active ? ' checked' : '') +
          '><span>表示</span></label>' +
      '</div>' +
      '<div class="colorPick" role="group" aria-label="背景色">' +
        App.PLACE_COLOR_OPTIONS.map(function (o) {
          return '<button type="button" class="colorPick__btn' +
              (o.value ? '' : ' colorPick__btn--none') + '"' +
            ' data-color="' + esc(o.value) + '"' +
            (o.value ? ' style="background:var(--tint-' + esc(o.value) + ')"' : '') +
            ' aria-pressed="' + (o.value === color ? 'true' : 'false') + '"' +
            ' aria-label="背景色: ' + esc(o.label) + '" title="' + esc(o.label) + '">' +
            (o.value ? '' : 'なし') +
          '</button>';
        }).join('') +
      '</div>' +
    '</li>';
  }

  // ------------------------------------------------------------ 割り当て

  /*
    候補者の抽出（design.md 6.3）は、この節で**クライアント側に閉じている**。
    getDayBoard が返したその日のデータだけで計算し、パネルを開くたびにサーバーへ
    問い合わせない（CLAUDE.md 開発ルール）。ただし保存時はサーバー側が同じ検証をやり直す。
  */

  function assignmentOf(id) {
    return state.assignments.filter(function (a) { return a.id === id; })[0] || null;
  }

  function personOf(personId) {
    return state.peopleById[personId] || null;
  }

  function personName(personId) {
    const p = personOf(personId);
    return p ? p.name : '(不明な人)';
  }

  function isStaff(personId) {
    const p = personOf(personId);
    return !!p && p.type === 'staff';
  }

  function placeNameOf(placeId) {
    const p = state.places.filter(function (x) { return x.id === placeId; })[0];
    return p ? p.name : '(不明な場所)';
  }

  /**
   * 絞り込み用の正規化。
   * カタカナはひらがなに、全角英数は半角に寄せ、空白と大小の違いは無視する。
   * 「タナカ」でも「たなか」でも同じ人に当たるようにするための最低限。
   * 半角カナまでは面倒を見ない（人マスタにも入力にもまず出てこない）。
   */
  function normalizeForSearch(text) {
    return String(text === null || text === undefined ? '' : text)
      .replace(/[ァ-ヶ]/g, function (c) {
        return String.fromCharCode(c.charCodeAt(0) - 0x60);
      })
      .replace(/[！-～]/g, function (c) {
        return String.fromCharCode(c.charCodeAt(0) - 0xfee0);
      })
      .replace(/[\s　]/g, '')
      .toLowerCase();
  }

  /**
   * 氏名とかなを別々に正規化してタブでつなぐ。
   * つなぎ目に空白を使うと、正規化で空白が消えて「田中」＋「たなか」が
   * 1つの語のように繋がり、跨いだ検索語が誤ってヒットする。
   */
  function personSearchKey(person) {
    return [person.name, person.kana].map(normalizeForSearch).join('\t');
  }

  /** 半開区間 [aStart, aEnd) と [bStart, bEnd)。接するだけは重ならない（design.md 6.1） */
  function overlapsRange(aStart, aEnd, bStart, bEnd) {
    return aStart < bEnd && bStart < aEnd;
  }

  /**
   * person_id → 可用時間帯（分）。
   *
   * **職員の既定勤務時間帯はサーバーが補って返している**（service_board.js
   * `appendStaffDefaultAvailability_`）。補われた区間には `virtual` が付いており、
   * シートには存在しない。**本人の申告と同じ扱いで候補に出してよいが、
   * 画面に「申告」と書いてはいけない。**
   */
  function availabilityByPerson() {
    const map = {};
    state.availability.forEach(function (a) {
      (map[a.person_id] = map[a.person_id] || [])
        .push({ start: toMin(a.start_time), end: toMin(a.end_time), virtual: a.virtual === true });
    });
    return map;
  }

  /** person_id → その日の割り当て合計分数。候補者の並べ替えに使う */
  function loadByPerson() {
    const map = {};
    state.assignments.forEach(function (a) {
      map[a.person_id] = (map[a.person_id] || 0) + (toMin(a.end_time) - toMin(a.start_time));
    });
    return map;
  }

  /** ボランティアを先に、同種別では当日の割当が少ない順、次に かな／名前（design.md 6.3） */
  function compareCandidates(a, b) {
    const at = a.person.type === 'staff' ? 1 : 0;
    const bt = b.person.type === 'staff' ? 1 : 0;
    if (at !== bt) return at - bt;
    if (a.load !== b.load) return a.load - b.load;
    const ak = a.person.kana || a.person.name || '';
    const bk = b.person.kana || b.person.name || '';
    return String(ak).localeCompare(String(bk), 'ja');
  }

  /**
   * ボランティアと職員に分けて並べる。ボランティア優先が画面から分かるようにする。
   *
   * 見出しとリストを1つの箱にまとめてあるのは、絞り込みで中身が空になったとき
   * 見出しごと隠すため（`setUpPickFilter`）。
   */
  function volunteerStaffHtml(rows, rowFn) {
    const volunteers = rows.filter(function (r) { return r.person.type !== 'staff'; });
    const staff = rows.filter(function (r) { return r.person.type === 'staff'; });
    const group = function (label, list) {
      if (list.length === 0) return '';
      return '<div class="pickGroup"><h4>' + label + '</h4>' +
        '<ul class="pList">' + list.map(rowFn).join('') + '</ul></div>';
    };
    return group('ボランティア', volunteers) + group('職員', staff);
  }

  /**
   * 押して選べる人の1行。
   * 氏名の下に性別・年齢を添える（管理画面のときだけサーバーが載せてくる）。
   */
  function pickRowHtml(attrs, person, note) {
    const meta = personMeta(person);
    return '<li data-search="' + esc(personSearchKey(person)) + '">' +
      '<button type="button" class="pRow pRow--pick" ' + attrs + '>' +
      '<span class="pName">' + esc(person.name) +
        (meta ? '<small class="pMeta">' + esc(meta) + '</small>' : '') + '</span>' +
      '<span class="pLoad">' + esc(note) + '</span>' +
      '<span class="pAdd">＋</span>' +
    '</button></li>';
  }

  // ------------------------------------------- 割り当ての編集（既にある帯）

  /**
   * 割り当てのパネル。**場所・時間・メモを直すか、解除するか**の2つだけ。
   *
   * かつてここは「枠のパネル」で、下半分に候補者の一覧が並んでいた。
   * **枠と割り当てが1対1になったので、人を足すという操作そのものが無くなった。**
   * 人を替えるときは解除してから入れ直す（`_log` に外れた記録を残すため）。
   */
  function openAssignmentPanel(assignmentId) {
    const row = assignmentOf(assignmentId);
    if (!row) {
      closeModal();
      return;
    }
    const person = personOf(row.person_id);
    const meta = person ? personMeta(person) : '';

    openModal(placeNameOf(row.place_id) + ' ' + tl(row.start_time) + '–' + tl(row.end_time),
      '<p class="formError" hidden></p>' +
      '<p class="panelHead">' + esc(personName(row.person_id)) +
        (isStaff(row.person_id) ? '（職員）' : '') + '</p>' +
      (meta ? '<p class="hint">' + esc(meta) + '</p>' : '') +
      '<p class="hint">' + esc(availabilityLabel(row.person_id)) + '</p>' +
      '<div class="field"><label for="f_place">場所</label>' +
        '<select id="f_place">' + placeOptions(row.place_id) + '</select></div>' +
      '<div class="field field--row">' +
        '<div><label>開始</label>' +
          timeFields({ id: 'f_start', value: row.start_time, label: '開始' }) + '</div>' +
        '<div><label>終了</label>' +
          timeFields({ id: 'f_end', value: row.end_time, label: '終了' }) + '</div>' +
      '</div>' +
      '<div class="field"><label for="f_note">メモ（任意）</label>' +
        '<input type="text" id="f_note" value="' + esc(row.note || '') + '" maxlength="100"></div>' +
      '<p class="warnLine" id="f_warn" hidden></p>' +
      '<div class="formActions">' +
        '<button type="button" class="btn btn--danger" id="f_unassign">この人を外す</button>' +
        '<div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">閉じる</button>' +
        '<button type="button" class="btn btn--primary" id="f_save">保存</button>' +
      '</div>');

    const updateWarn = function () {
      const w = timeWarning(row.person_id, readTime($('f_start')), readTime($('f_end')), assignmentId);
      $('f_warn').textContent = w;
      $('f_warn').hidden = !w;
    };
    App.onTimeFieldsInput($('f_start'), updateWarn);
    App.onTimeFieldsInput($('f_end'), updateWarn);
    updateWarn();

    $('f_save').addEventListener('click', function () {
      if (state.busy) return;
      const payload = {
        id: assignmentId,
        place_id: $('f_place').value,
        start_time: readTime($('f_start')),
        end_time: readTime($('f_end')),
        note: $('f_note').value
      };
      // クライアント側の検証は入力補助。判定はサーバー側が本体
      if (!payload.start_time || !payload.end_time) {
        showFormError('時刻を入力してください（時は0〜' + App.TIME_MAX_HOUR + '、分は0〜59）。');
        return;
      }
      if (toMin(payload.start_time) >= toMin(payload.end_time)) {
        showFormError('終了時刻は開始時刻より後にしてください。');
        return;
      }

      setBusy(true);
      call('saveAssignment', state.token, payload)
        .then(function (data) {
          state.assignments = state.assignments.map(function (a) {
            return a.id === assignmentId ? data.assignment : a;
          });
          closeModal();
          render();
          toast('保存しました');
        })
        .catch(function (e) { showFormError(e.message); })
        .then(function () { setBusy(false); });
    });

    $('f_unassign').addEventListener('click', function () {
      doUnassign(assignmentId);
    });
  }

  /**
   * 前日から続いている帯をタップしたとき。
   *
   * **ここでは直させない。** この画面の時刻（`02:00`）と保存値（`26:00`）が違うため、
   * そのまま保存すると前日の割り当てが早朝の時刻で上書きされる。
   * 元の日へ移動すれば、いつもの編集パネルで直せる。
   */
  function openCarriedModal(assignmentId, originDate) {
    const row = assignmentOf(assignmentId);
    if (!row) return;

    openModal('前日から続いている割り当て',
      '<p class="panelHead">' + esc(personName(row.person_id)) + 'さん</p>' +
      '<p>' + esc(placeNameOf(row.place_id)) + '<br>' +
        esc(originDate) + ' の ' +
        esc(tl(row.origin_start_time)) + '–' + esc(tl(row.origin_end_time)) + '</p>' +
      '<p class="hint">この割り当ては ' + esc(originDate) + ' に登録されています。' +
        'ここは続きを表示しているだけなので、直すときは元の日を開いてください。</p>' +
      '<div class="formActions"><div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">閉じる</button>' +
        '<button type="button" class="btn btn--primary" id="c_go">' +
          esc(originDate) + ' を開く</button>' +
      '</div>');

    $('c_go').addEventListener('click', function () {
      closeModal();
      loadDay(originDate).then(function () { openAssignmentPanel(assignmentId); });
    });
  }

  /**
   * 解除。**楽観的更新はしない。**
   * 人が消える操作なので、サーバーが受けたことを確かめてから画面を書き換える。
   */
  function doUnassign(assignmentId) {
    if (state.busy) return;
    setBusy(true);
    call('unassign', state.token, assignmentId)
      .then(function () {
        state.assignments = state.assignments.filter(function (a) { return a.id !== assignmentId; });
        closeModal();
        render();
        toast('解除しました');
      })
      .catch(function (e) { showFormError(e.message); })
      .then(function () { setBusy(false); });
  }

  // -------------------------------------------- 人を入れる（空きをタップ）

  /*
    **これが唯一の割り当て経路。** 場所の空いているところをタップ → 人を選ぶ →
    時間を決める → 1件の割り当てができる。

    順番は「人 → 時間」。先に人を選べば、その人が申告した時間帯をそのまま
    初期値にできる（「来られる時間をそのまま入れる」運用に合う）。
  */

  /**
   * 人を選ぶ画面。時間はまだ決まっていないので、その日に申告のある人を全員出す。
   *
   * @param {string} placeId
   * @param {Object} preset タップ位置から割り出した仮の時間帯
   */
  function openNewAssignPanel(placeId, preset) {
    const rows = dayCandidates(placeId, preset);

    openModal(placeNameOf(placeId) + ' に人を入れる',
      '<p class="panelHead">入れる人を選んでください</p>' +
      '<p class="hint">選んだあとに時間を決めます。</p>' +
      (rows.length === 0
        ? '<p class="empty empty--sm">この日に入れる人がまだいません。' +
          '応募フォームからの登録をお待ちください。</p>'
        : '<div class="field"><label for="pickFilter">名前で絞り込む</label>' +
            '<input type="search" id="pickFilter" autocomplete="off"' +
            ' placeholder="氏名・かなの一部"></div>' +
          '<section class="assignSec">' +
            volunteerStaffHtml(rows, dayCandidateRowHtml) +
            '<p class="empty empty--sm" id="pickNoHit" hidden>該当する人がいません。</p>' +
          '</section>') +
      '<div class="formActions"><div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">閉じる</button></div>');

    $('modalBody').querySelectorAll('[data-pick]').forEach(function (el) {
      el.addEventListener('click', function () {
        openTimePickPanel(placeId, el.dataset.pick, {
          start_time: el.dataset.start,
          end_time: el.dataset.end
        }, function () { openNewAssignPanel(placeId, preset); });
      });
    });

    setUpPickFilter();
  }

  /**
   * 人の一覧をその場で絞り込む。
   *
   * 一覧を組み直さずに行の表示・非表示だけを切り替える。
   * 組み直すと入力欄が作り直されてフォーカスと変換中の文字が飛ぶ。
   */
  function setUpPickFilter() {
    const input = $('pickFilter');
    if (!input) return;

    const body = $('modalBody');
    const items = Array.prototype.slice.call(body.querySelectorAll('.pList > li'));
    const groups = Array.prototype.slice.call(body.querySelectorAll('.pickGroup'));
    const noHit = $('pickNoHit');

    const apply = function () {
      const q = normalizeForSearch(input.value);
      let hit = 0;
      items.forEach(function (li) {
        const ok = !q || (li.dataset.search || '').indexOf(q) >= 0;
        li.hidden = !ok;
        if (ok) hit += 1;
      });
      groups.forEach(function (g) {
        g.hidden = !g.querySelector('li:not([hidden])');
      });
      noHit.hidden = hit > 0;
    };

    input.addEventListener('input', apply);
    // 入力中の Enter でモーダルが閉じたり送信されたりしないように止める
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') e.preventDefault();
    });

    // キーボードのある端末だけ最初からフォーカスする。
    // スマホで自動フォーカスすると、開くたびにソフトキーボードが一覧を覆う
    if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      input.focus();
    }
  }

  /**
   * その日に入れる人の一覧（時間は未定）。
   *
   * 時間が決まっていないのでダブルブッキングの除外はできない。
   * 重なりは時間を決める画面で知らせ、最終的にはサーバー側が弾く。
   */
  function dayCandidates(placeId, preset) {
    const avail = availabilityByPerson();
    const load = loadByPerson();
    const hintStart = preset && preset.start_time ? toMin(preset.start_time) : null;
    const hintEnd = preset && preset.end_time ? toMin(preset.end_time) : null;

    const rows = [];
    state.people.forEach(function (p) {
      if (p.merged_into) return;
      const ranges = avail[p.id] || [];
      // 入れる時間帯が無い人は出さない。職員には既定の勤務時間帯がサーバーで補われるので、
      // 申告していなくても毎日ここに出る
      if (ranges.length === 0) return;

      // タップした時間と重なる区間があればそれを、無ければ最初の区間を初期値にする
      const hit = (hintStart === null) ? null : ranges.filter(function (r) {
        return overlapsRange(hintStart, hintEnd, r.start, r.end);
      })[0];
      const base = hit || ranges[0];

      rows.push({
        person: p,
        load: load[p.id] || 0,
        preset_start: toHHMM(base.start),
        preset_end: toHHMM(base.end),
        // 補われた既定の時間帯は「（既定）」と断る。本人の申告と読み違えないように
        ranges: ranges.map(function (r) { return ml(r.start) + '–' + ml(r.end); }).join('、') +
          (isDefaultOnly(ranges) ? '（既定）' : '')
      });
    });

    return rows.sort(compareCandidates);
  }

  function dayCandidateRowHtml(row) {
    return pickRowHtml(
      'data-pick="' + esc(row.person.id) + '"' +
      ' data-start="' + esc(row.preset_start) + '"' +
      ' data-end="' + esc(row.preset_end) + '"',
      row.person, row.ranges);
  }

  /** 時間を決める画面。ここで登録すると1件の割り当てができる */
  function openTimePickPanel(placeId, personId, preset, back) {
    const person = personOf(personId);
    if (!person) return;

    const cfg = state.config;
    const start = preset.start_time || cfg.day_start;
    const end = preset.end_time || cfg.day_end;

    openModal(placeNameOf(placeId) + ' / ' + person.name,
      '<p class="formError" hidden></p>' +
      '<p class="panelHead">' + esc(person.name) + 'さんを入れる時間</p>' +
      '<p class="hint">' + esc(availabilityLabel(personId)) + '</p>' +
      '<div class="field field--row">' +
        '<div><label>開始</label>' +
          timeFields({ id: 'n_start', value: start, label: '開始' }) + '</div>' +
        '<div><label>終了</label>' +
          timeFields({ id: 'n_end', value: end, label: '終了' }) + '</div>' +
      '</div>' +
      '<div class="field"><label for="n_note">メモ（任意）</label>' +
        '<input type="text" id="n_note" maxlength="100"></div>' +
      '<p class="warnLine" id="n_warn" hidden></p>' +
      '<div class="formActions">' +
        (back ? '<button type="button" class="btn" id="n_back">戻る</button>' : '') +
        '<div class="formActions__spacer"></div>' +
        '<button type="button" class="btn" data-close="1">キャンセル</button>' +
        '<button type="button" class="btn btn--primary" id="n_save">この内容で登録</button>' +
      '</div>');

    if (back) $('n_back').addEventListener('click', back);

    const updateWarn = function () {
      const w = timeWarning(personId, readTime($('n_start')), readTime($('n_end')), null);
      $('n_warn').textContent = w;
      $('n_warn').hidden = !w;
    };
    App.onTimeFieldsInput($('n_start'), updateWarn);
    App.onTimeFieldsInput($('n_end'), updateWarn);
    updateWarn();

    $('n_save').addEventListener('click', function () {
      if (state.busy) return;
      const payload = {
        date: state.date,
        place_id: placeId,
        start_time: readTime($('n_start')),
        end_time: readTime($('n_end')),
        person_id: personId,
        note: $('n_note').value
      };
      if (!payload.start_time || !payload.end_time) {
        showFormError('時刻を入力してください（時は0〜' + App.TIME_MAX_HOUR + '、分は0〜59）。');
        return;
      }
      if (toMin(payload.start_time) >= toMin(payload.end_time)) {
        showFormError('終了時刻は開始時刻より後にしてください。');
        return;
      }
      submitAssign(payload);
    });
  }

  /**
   * その人がその日に入れる時間帯の説明。
   *
   * **サーバーが補った職員の既定勤務時間帯を「申告」と書かない。**
   * 本人が出した申告と取り違えると、確認を取る相手や内容を間違える。
   *
   * @param {string=} emptyText 入れる時間帯が1つも無いときの文言
   */
  function availabilityLabel(personId, emptyText) {
    const ranges = availabilityByPerson()[personId] || [];
    if (ranges.length === 0) return emptyText || 'この日の申告はありません。';
    const label = ranges.map(function (r) {
      return ml(r.start) + '–' + ml(r.end);
    }).join('、');
    return isDefaultOnly(ranges) ? '職員の既定の勤務時間帯: ' + label : '申告: ' + label;
  }

  /** すべてサーバーが補った区間か（本人の申告が1つも無いか） */
  function isDefaultOnly(ranges) {
    return ranges.length > 0 && ranges.every(function (r) { return r.virtual; });
  }

  /**
   * 選んだ時間についての注意書き。**登録は止めない。**
   * 成立しない組み合わせはサーバー側が弾くので、ここでは先に気づけるようにする。
   *
   * @param {?string} selfId 編集中の割り当てID（自分自身は衝突相手から除く）
   */
  function timeWarning(personId, startStr, endStr, selfId) {
    if (!startStr || !endStr) return '';   // 入力途中は何も言わない
    const start = toMin(startStr);
    const end = toMin(endStr);
    if (start >= end) return '';

    const conflict = state.assignments.filter(function (a) {
      if (a.id === selfId) return false;
      if (a.person_id !== personId) return false;
      return overlapsRange(start, end, toMin(a.start_time), toMin(a.end_time));
    })[0];
    if (conflict) {
      return '同じ時間に「' + placeNameOf(conflict.place_id) + ' ' +
        tl(conflict.start_time) + '–' + tl(conflict.end_time) +
        '」へ割り当て済みです。このままでは登録できません。';
    }

    const ranges = availabilityByPerson()[personId] || [];
    const covered = ranges.some(function (r) { return r.start <= start && end <= r.end; });
    if (!covered) return '申告された時間の外です。登録はできますが、確認してください。';
    return '';
  }

  /**
   * 割り当てを1件登録する。
   *
   * **楽観的更新はしない。** IDがサーバーで決まるうえ、同じ場所・同じ時間の
   * 重なりはサーバーでしか正しく判定できない。先に画面へ置くと巻き戻しが増える。
   */
  function submitAssign(payload) {
    setBusy(true);
    call('assign', state.token, payload)
      .then(function (data) {
        state.assignments = state.assignments.concat([data.assignment]);
        closeModal();
        render();
        toast('割り当てました');
      })
      .catch(function (e) { showFormError(e.message); })
      .then(function () { setBusy(false); });
  }

  // ------------------------------------------------------------ イベント

  $('prevDay').addEventListener('click', function () { loadDay(addDays(state.date, -1)); });
  $('nextDay').addEventListener('click', function () { loadDay(addDays(state.date, 1)); });
  $('todayBtn').addEventListener('click', function () { loadDay(todayStr()); });

  $('datePicker').addEventListener('change', function (e) {
    if (e.target.value) loadDay(e.target.value);
    else e.target.value = state.date;
  });

  /*
    印刷ビューを別のタブで開く（?view=print）。**この画面では印刷しない。**
    管理操作のためのDOMを @media print で打ち消し続けるのは無理があり、
    画面を直すたびに紙が静かに崩れるため、紙は専用の画面で組み立てる。

    **別のタブで開くこと。** この画面をそのまま残せるので、印刷ビューに
    「配置表へ戻る」を持たせる必要が無くなる（タブを閉じれば元の作業に戻れる）。
  */
  $('pdfBtn').addEventListener('click', function () {
    window.open(App.appUrl({
      t: state.token,
      view: 'print',
      d: state.date
    }), '_blank');
  });

  /*
    管理用のボタンは管理URL（?view=admin）でしか存在しない。
    閲覧URLでは要素そのものが無いので、まとめて分岐の内側に置く。
  */
  if (state.adminMode) {
    $('placesBtn').addEventListener('click', openPlacesModal);
  }

  boot();
})();
</script>

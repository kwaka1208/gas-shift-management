<script>
/*
  common_script.html … 配置表（board）と応募フォーム（entry）の両方で使う処理

  ここに置くのは「どの画面でも同じもの」だけ。画面固有のロジックは持ち込まない。
  依存するDOMは #toast のみ（両画面が持っている）。
*/
const App = (function () {
  'use strict';

  /**
   * google.script.run を Promise にする。
   * 戻り値は { ok, data } / { ok, error } に統一されている前提。
   * 成功・失敗の両ハンドラを必ず付ける（gas.md 6）。
   */
  function call(name) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (!window.google || !google.script || !google.script.run) {
        // HtmlService の外（ファイルを直接開いた等）。通信の問題ではない
        reject(new Error('この画面はアプリのURLから開いてください。'));
        return;
      }

      const runner = google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok) {
            resolve(res.data);
            return;
          }
          const e = new Error((res && res.error) || '処理できませんでした。');
          /*
            送り直してよい印。サーバー側（api.js の err_）が、処理が1行も
            走っていないと分かっているエラーにだけ付ける。
            **呼び出し側でこの印を推測して補ってはいけない。**
          */
          if (res && res.retryable === true) e.retryable = true;
          reject(e);
        })
        /*
          ここへ来るのは、サーバー側の関数に届かなかったときだけ
          （api.js の handle_ が例外を捕まえるので、業務エラーは success 側で返る）。

          実際にはデプロイ設定の誤りが最も多い。「電波」とだけ言うと利用者が
          何度もリロードし続けるので、**原因の見当が付く文言にする。**
          詳細は console にも出す（利用者には見せないが、問い合わせ時に確認できる）。

          ここでは retryable を立てない。サーバーに届かなかったのか、処理が終わった
          あとに応答を落としたのかを区別できないため、自動で送り直すと二重登録になる。
        */
        .withFailureHandler(function (err) {
          console.error('[' + name + '] google.script.run failed:', err);
          const detail = (err && err.message) ? String(err.message).trim() : '';
          reject(new Error(detail ||
            'サーバーに接続できませんでした。\n' +
            '通信状態を確認して、画面を再読み込みしてください。\n' +
            '何度も出る場合は、配布元にこの画面を見せてください。'));
        });
      runner[name].apply(runner, args);
    });
  }

  /**
   * 画面から画面へのリンクURLを組み立てる。
   *
   * **必ずこれを使うこと。** HtmlService の画面は iframe（サンドボックス）の中で動くため、
   * `?t=...` のような相対URLは googleusercontent.com のサンドボックスURLに対して
   * 解決されてしまい、アプリのURLにならない。サーバーが渡す絶対URLを土台にする。
   *
   * @param {Object} params クエリ（値が空のものは付けない）
   */
  function appUrl(params) {
    const q = Object.keys(params || {})
      .filter(function (k) { return params[k] !== '' && params[k] !== undefined && params[k] !== null; })
      .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); })
      .join('&');
    // baseUrl が空になるのは未デプロイのときだけ。そのときは相対URLで凌ぐ
    return (BOOT.baseUrl || '') + '?' + q;
  }

  /*
    性別。シートには英語コードで保存し、画面に出すときだけ日本語へ直す
    （サーバー側の定義は config.js の GENDER / GENDER_VALUES。値を足すときは両方直す）。

    応募フォームの選択肢と配置表の表示を、この1か所から作る。
    片方だけ直して表示が食い違う、という壊れ方を避けるため。

    `short` は配置表に出す短縮形。**空の選択肢は配置表に出さない。**
    「その他」「回答しない」は、配置表に並べても割り当ての判断材料にならないうえ、
    答えなかったこと自体が一覧で目立ってしまうため出さない。
    ただし応募者本人の控えには選んだとおりに出す（`genderLabel`）。
  */
  const GENDER_OPTIONS = [
    { value: 'male', label: '男性', short: '男' },
    { value: 'female', label: '女性', short: '女' },
    { value: 'other', label: 'その他', short: '' },
    { value: 'undisclosed', label: '回答しない', short: '' }
  ];

  /** 保存値 → 選択肢。未登録・不明な値は null */
  function genderOption(value) {
    return GENDER_OPTIONS.filter(function (o) { return o.value === value; })[0] || null;
  }

  /** 保存値 → 表示名。未登録・不明な値は空文字（表示しない） */
  function genderLabel(value) {
    const hit = genderOption(value);
    return hit ? hit.label : '';
  }

  /** HTML エスケープ。テンプレートリテラルに値を差し込む前に必ず通す */
  function esc(s) {
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function toMin(hhmm) {
    const p = String(hhmm).split(':');
    return Number(p[0]) * 60 + Number(p[1]);
  }

  function toHHMM(min) {
    const m = Math.max(0, Math.round(min));
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }

  /** 日付計算は UTC で行う。端末のタイムゾーンでずらさない */
  function addDays(dateStr, n) {
    const p = dateStr.split('-').map(Number);
    const dt = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    dt.setUTCDate(dt.getUTCDate() + n);
    return dt.toISOString().slice(0, 10);
  }

  function dowOf(dateStr) {
    const p = dateStr.split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
  }

  /** 端末のカレンダー上の今日 */
  function todayStr() {
    const d = new Date();
    return [d.getFullYear(),
      String(d.getMonth() + 1).padStart(2, '0'),
      String(d.getDate()).padStart(2, '0')].join('-');
  }

  /*
    時刻の入力欄（時・分をそれぞれ直接入力する）。

    プルダウンは選択肢が多くなるほど遠くなり、スマホでは特に辛い。
    数字を打てる人には打たせる方が速いので、2つの数値入力にしている。
    表示時間帯の外の時刻も入力できる（配置表の表示範囲は _config で別に決まる）。
  */

  /**
   * @param {{id?: string, cls?: string, value?: string, label?: string}} opts
   *   value は 'HH:mm'。空でもよい
   */
  function timeFields(opts) {
    const o = opts || {};
    const v = String(o.value || '');
    const ok = /^\d{1,2}:\d{2}$/.test(v);
    const h = ok ? String(Number(v.split(':')[0])) : '';
    const m = ok ? v.split(':')[1] : '';
    const label = o.label ? esc(o.label) + 'の' : '';

    return '<span class="timeInput' + (o.cls ? ' ' + o.cls : '') + '"' +
      (o.id ? ' id="' + o.id + '"' : '') + '>' +
      '<input type="number" class="timeInput__h" inputmode="numeric" pattern="[0-9]*"' +
        ' min="0" max="23" step="1" value="' + esc(h) + '" aria-label="' + label + '時">' +
      '<span class="timeInput__sep">:</span>' +
      '<input type="number" class="timeInput__m" inputmode="numeric" pattern="[0-9]*"' +
        ' min="0" max="59" step="1" value="' + esc(m) + '" aria-label="' + label + '分">' +
    '</span>';
  }

  /**
   * 時刻入力欄の値を 'HH:mm' で読む。
   * **未入力・範囲外のときは空文字を返す。** 呼び出し側でエラーにすること。
   */
  function readTimeFields(el) {
    if (!el) return '';
    const h = el.querySelector('.timeInput__h').value.trim();
    const m = el.querySelector('.timeInput__m').value.trim();
    if (h === '' || m === '') return '';

    const hn = Number(h);
    const mn = Number(m);
    if (!isFinite(hn) || !isFinite(mn)) return '';
    if (hn !== Math.floor(hn) || mn !== Math.floor(mn)) return '';
    if (hn < 0 || hn > 23 || mn < 0 || mn > 59) return '';

    return String(hn).padStart(2, '0') + ':' + String(mn).padStart(2, '0');
  }

  /** 時刻入力欄に 'HH:mm' を書き戻す */
  function writeTimeFields(el, value) {
    if (!el || !/^\d{1,2}:\d{2}$/.test(String(value))) return;
    const parts = String(value).split(':');
    el.querySelector('.timeInput__h').value = String(Number(parts[0]));
    el.querySelector('.timeInput__m').value = parts[1];
  }

  /** 時・分のどちらが変わっても呼ばれるようにする */
  function onTimeFieldsInput(el, fn) {
    if (!el) return;
    el.querySelectorAll('input').forEach(function (input) {
      input.addEventListener('input', fn);
      input.addEventListener('change', fn);
    });
  }

  let toastTimer = null;
  function toast(message, isError) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = message;
    el.className = 'toast' + (isError ? ' toast--error' : '');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, isError ? 6000 : 2600);
  }

  return {
    call: call,
    appUrl: appUrl,
    esc: esc,
    GENDER_OPTIONS: GENDER_OPTIONS,
    genderOption: genderOption,
    genderLabel: genderLabel,
    toMin: toMin,
    toHHMM: toHHMM,
    addDays: addDays,
    dowOf: dowOf,
    todayStr: todayStr,
    timeFields: timeFields,
    readTimeFields: readTimeFields,
    writeTimeFields: writeTimeFields,
    onTimeFieldsInput: onTimeFieldsInput,
    toast: toast
  };
})();
</script>
